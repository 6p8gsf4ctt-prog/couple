<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F4EFE6">
<title>Couple — Ritual Lab · Passage + Voile</title>
<style>
:root{
  --ivory:#F5F0E7;
  --ivory-2:#EFE6DA;
  --paper:#FCF8F0;
  --paper-2:#F3EBDD;
  --graphite:#312C29;
  --muted:#81746C;
  --sand:#D8C3AE;
  --blush:#DCA39C;
  --blush-2:#EBC7C1;
  --burgundy:#7A343E;
  --burgundy-2:#5F2831;
  --champagne:#D8BF99;
  --line:#DCCDBE;
  --shadow:rgba(64,43,31,.12);
  --ease:cubic-bezier(.2,.82,.2,1);
  --ease-soft:cubic-bezier(.3,.7,.25,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ivory);color:var(--graphite)}
body{
  min-height:100dvh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -8%,rgba(255,255,255,.88),transparent 38%),
    linear-gradient(180deg,#F8F3EA 0%,#F2E9DE 100%);
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  padding:max(14px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
}
.topbar{
  width:min(560px,100%);
  margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  z-index:50;
}
.wordmark small{
  display:block;color:var(--burgundy);font-size:8px;letter-spacing:.22em;font-weight:800
}
.wordmark strong{
  display:block;margin-top:3px;font-family:Georgia,"Times New Roman",serif;
  font-size:17px;font-weight:400;letter-spacing:.01em
}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(122,52,62,.15);
  background:rgba(252,248,240,.72);color:var(--burgundy);display:grid;place-items:center;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
}
.icon-btn:active{transform:scale(.96)}
.switch{
  justify-self:center;
  margin:10px auto 0;
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
  padding:4px;
  border-radius:22px;
  background:rgba(223,211,199,.52);
  border:1px solid rgba(191,171,153,.34);
}
.switch button{
  min-width:118px;height:38px;border:0;border-radius:18px;background:transparent;
  color:var(--muted);font-size:12px
}
.switch button.active{
  color:var(--burgundy);font-weight:750;background:rgba(252,248,240,.93);
  box-shadow:0 4px 12px rgba(70,47,35,.055)
}
.scene{
  position:relative;
  width:min(560px,100%);
  min-height:0;
  height:100%;
  margin:0 auto;
  overflow:hidden;
}
.copy{
  position:relative;z-index:30;
  min-height:120px;
  padding:16px 8px 0;
  text-align:center;
  pointer-events:none;
}
.eyebrow{
  color:var(--burgundy);
  font-size:8px;letter-spacing:.2em;font-weight:800
}
.copy h1{
  margin:8px 0 0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:clamp(28px,7vw,39px);
  line-height:1.03;
  letter-spacing:-.025em
}
.copy p{
  margin:8px auto 0;
  max-width:385px;
  color:var(--muted);
  font-size:12px;
  line-height:1.47
}
.workspace{
  position:absolute;inset:116px 0 0;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}
.hint{
  position:absolute;z-index:80;left:50%;bottom:15px;
  transform:translateX(-50%);
  min-width:max-content;max-width:92%;
  padding:8px 13px;border-radius:16px;
  background:rgba(252,248,240,.8);
  border:1px solid rgba(200,180,162,.46);
  color:var(--burgundy);
  font-size:10px;letter-spacing:.045em;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transition:opacity .25s ease,transform .25s ease
}
.hint.hidden{opacity:0;transform:translate(-50%,6px);pointer-events:none}
.progress-shell{
  position:absolute;z-index:75;left:50%;bottom:55px;transform:translateX(-50%);
  width:150px;height:3px;border-radius:3px;overflow:hidden;
  background:rgba(176,153,136,.20);
  opacity:0;transition:opacity .18s ease
}
.progress-shell.visible{opacity:1}
.progress-shell i{display:block;height:100%;width:0;background:var(--burgundy);border-radius:3px}
.footer{
  width:min(560px,100%);
  margin:0 auto;
  text-align:center;color:var(--muted);
  font-size:8px;letter-spacing:.07em;
  padding-top:6px
}

/* -------------------------------------------------------
   Cheque Signature
------------------------------------------------------- */
.cheque{
  position:relative;
  display:grid;
  grid-template-columns:54px 1px 1fr;
  width:100%;height:100%;
  background:
    radial-gradient(circle at 13% 18%,rgba(123,89,65,.035) 0 1px,transparent 1.3px),
    radial-gradient(circle at 70% 66%,rgba(255,255,255,.56) 0 1px,transparent 1.3px),
    linear-gradient(180deg,#FCF8F0,#FAF5EB);
  border:1px solid #E0D0C0;
  border-radius:22px;
  box-shadow:0 18px 34px rgba(67,45,31,.105);
  overflow:visible
}
.cheque-stub{
  border-radius:21px 0 0 21px;
  background:linear-gradient(180deg,rgba(220,163,156,.16),rgba(216,191,153,.07));
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  position:relative
}
.cheque-stub span{
  transform:rotate(-90deg);white-space:nowrap;
  color:var(--burgundy);font-size:7px;letter-spacing:.22em
}
.cheque-perf{margin:9px 0;border-left:1px dashed #C7B3A4}
.cheque-body{
  padding:17px 16px 13px;min-width:0;
  display:grid;align-content:center;text-align:center
}
.cheque-kicker{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--burgundy);font-size:19px;letter-spacing:.14em
}
.cheque-title{
  margin-top:10px;
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:24px;line-height:1.08
}
.cheque-message{
  margin-top:9px;
  font-family:Georgia,"Times New Roman",serif;font-style:italic;
  color:var(--muted);font-size:12px;line-height:1.38
}
.cheque-meta{
  margin-top:13px;
  display:flex;justify-content:space-between;gap:8px;
  color:#897A70;font-size:7px;letter-spacing:.09em
}
.cheque-mark{
  position:absolute;right:-14px;top:45%;
  width:39px;height:39px;border-radius:50%;
  background:linear-gradient(145deg,#E5B4AD,#CC807C);
  color:#FFF8F2;border:1px solid rgba(141,76,76,.12);
  display:grid;place-items:center;font-size:18px;
  box-shadow:0 7px 14px rgba(99,52,52,.11)
}

/* -------------------------------------------------------
   LE PASSAGE
------------------------------------------------------- */
.passage{
  --p:0;
}
.threshold{
  position:absolute;z-index:3;left:8%;right:8%;top:4%;
  height:58px;
}
.threshold-line{
  position:absolute;left:4%;right:4%;top:17px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(122,52,62,.18),rgba(122,52,62,.34),rgba(122,52,62,.18),transparent)
}
.threshold-glow{
  position:absolute;left:15%;right:15%;top:-12px;height:54px;
  background:radial-gradient(ellipse at center,rgba(216,191,153,.28),transparent 68%);
  filter:blur(8px);
  opacity:calc(var(--p) * .95)
}
.threshold-label{
  position:absolute;left:50%;top:27px;transform:translateX(-50%);
  color:rgba(122,52,62,calc(.34 + var(--p)*.5));
  font-size:8px;letter-spacing:.18em
}
.passage-field{
  position:absolute;z-index:2;
  left:50%;top:6%;
  width:min(88%,440px);
  height:72%;
  transform:translateX(-50%);
}
.passage-arch{
  position:absolute;inset:0 3%;
  border-radius:190px 190px 36px 36px;
  border:1px solid rgba(196,177,159,.37);
  border-bottom-color:rgba(196,177,159,.15);
  background:
    radial-gradient(ellipse at 50% 9%,rgba(255,255,255,.58),transparent 44%),
    linear-gradient(180deg,rgba(252,248,240,.35),rgba(241,232,219,.12));
}
.passage-arch:before,.passage-arch:after{
  content:"";position:absolute;border-radius:inherit;
  border:1px solid rgba(196,177,159,.22)
}
.passage-arch:before{inset:17px}
.passage-arch:after{inset:35px}
.passage-cheque{
  position:absolute;z-index:20;
  left:8%;right:8%;bottom:8%;
  height:205px;
  transform:
    translateY(calc(var(--p) * -298px))
    scale(calc(1 - var(--p)*.035));
  opacity:calc(1 - max(0,(var(--p) - .82))*3.8);
  filter:drop-shadow(0 calc(13px - var(--p)*7px) calc(20px - var(--p)*5px) rgba(64,42,30,.08));
  will-change:transform,opacity
}
.passage-cheque:after{
  content:"";position:absolute;inset:-9px;border-radius:28px;
  border:1px solid rgba(216,191,153,calc(var(--p)*.55));
  opacity:var(--p);pointer-events:none
}
.passage-resistance{
  position:absolute;z-index:18;left:50%;top:11%;
  transform:translateX(-50%) scale(calc(.85 + var(--p)*.15));
  width:12px;height:12px;border-radius:50%;
  background:rgba(122,52,62,calc(.1 + var(--p)*.7));
  box-shadow:0 0 calc(var(--p)*24px) rgba(122,52,62,.24);
  opacity:calc(var(--p)*1.2)
}
.passage-complete{
  position:absolute;z-index:50;left:50%;top:45%;
  transform:translate(-50%,-50%);
  text-align:center;width:92%;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease
}
.passage-complete.visible{opacity:1;pointer-events:auto}
.passage-complete .sigil{
  width:52px;height:52px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;
  border:1px solid rgba(122,52,62,.18);
  color:var(--burgundy);font-family:Georgia,"Times New Roman",serif;font-size:25px;
  background:rgba(252,248,240,.55)
}
.passage-complete h2{
  margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:31px
}
.passage-complete p{margin:8px 0 0;color:var(--muted);font-size:12px}

/* -------------------------------------------------------
   LE VOILE
------------------------------------------------------- */
.veil{
  --p:0;
}
.veil-stage{
  position:absolute;z-index:2;left:50%;top:7%;
  width:min(89%,440px);height:72%;
  transform:translateX(-50%);
}
.veil-cheque{
  position:absolute;z-index:5;
  left:7%;right:7%;top:17%;height:205px;
  filter:
    blur(calc((1 - var(--p))*2.1px))
    saturate(calc(.74 + var(--p)*.26));
  transform:scale(calc(.96 + var(--p)*.04));
  opacity:calc(.62 + var(--p)*.38);
  will-change:filter,transform,opacity
}
.veil-cheque .cheque-title,
.veil-cheque .cheque-message,
.veil-cheque .cheque-meta{
  opacity:calc(max(0,(var(--p) - .42))*1.72);
}
.veil-cheque .cheque-kicker{
  opacity:calc(.14 + var(--p)*1.1);
}
.veil-category{
  position:absolute;z-index:8;left:50%;top:23%;transform:translateX(-50%);
  padding:7px 11px;border-radius:14px;
  border:1px solid rgba(122,52,62,.12);
  background:rgba(252,248,240,.5);
  color:var(--burgundy);font-size:8px;letter-spacing:.18em;
  opacity:calc(max(0,(var(--p) - .12))*2.4);
  pointer-events:none
}
.veil-sheet{
  position:absolute;z-index:20;
  left:3%;right:3%;top:7%;height:78%;
  border-radius:27px;
  transform:
    translateX(calc(var(--p) * 103%))
    translateY(calc(var(--p) * -12px))
    rotate(calc(var(--p) * 3.2deg));
  transform-origin:92% 56%;
  will-change:transform,opacity;
  opacity:calc(1 - max(0,(var(--p)-.88))*6);
  background:
    radial-gradient(circle at 22% 18%,rgba(255,255,255,.74),transparent 28%),
    linear-gradient(105deg,rgba(255,255,255,.79),rgba(246,239,230,.91) 46%,rgba(235,224,212,.74));
  border:1px solid rgba(255,255,255,.67);
  box-shadow:
    0 16px 36px rgba(75,53,39,.08),
    inset 0 0 30px rgba(255,255,255,.38);
  -webkit-backdrop-filter:blur(9px) saturate(.9);
  backdrop-filter:blur(9px) saturate(.9);
}
.veil-sheet:before{
  content:"";
  position:absolute;inset:0;border-radius:inherit;
  background:
    repeating-linear-gradient(112deg,rgba(132,99,75,.018) 0 1px,transparent 1px 5px),
    radial-gradient(circle at 74% 62%,rgba(216,191,153,.10),transparent 28%);
}
.veil-sheet:after{
  content:"";
  position:absolute;top:0;bottom:0;left:10px;width:1px;
  background:rgba(255,255,255,.58)
}
.veil-grip{
  position:absolute;z-index:25;right:4%;top:45%;
  width:48px;height:48px;border-radius:50%;
  transform:translateY(-50%) translateX(calc(var(--p)*32px));
  display:grid;place-items:center;
  background:rgba(220,163,156,.86);
  color:white;border:1px solid rgba(138,73,73,.10);
  box-shadow:0 8px 17px rgba(102,55,54,.11);
  opacity:calc(1 - max(0,(var(--p)-.86))*7);
  pointer-events:none
}
.veil-grip:before{
  content:"";width:12px;height:1px;background:rgba(255,255,255,.86);
  box-shadow:0 -4px rgba(255,255,255,.72),0 4px rgba(255,255,255,.72)
}
.veil-final{
  position:absolute;z-index:45;left:50%;top:45%;transform:translate(-50%,-50%);
  width:88%;height:215px;
  opacity:0;pointer-events:none;
  transition:opacity .35s ease,transform .4s var(--ease);
}
.veil-final.visible{
  opacity:1;transform:translate(-50%,-50%) scale(1.01);pointer-events:auto
}
.veil-actions{
  position:absolute;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);
  opacity:0;pointer-events:none;transition:opacity .28s ease
}
.veil-actions.visible{opacity:1;pointer-events:auto}
.veil-actions button{
  height:38px;padding:0 16px;border-radius:19px;
  border:1px solid rgba(122,52,62,.17);
  background:rgba(252,248,240,.82);color:var(--burgundy);font-size:11px
}

/* reduced motion */
@media(prefers-reduced-motion:reduce){
  .passage-cheque,.veil-sheet,.veil-final,.passage-complete{transition-duration:.01ms!important}
}
@media(max-height:710px){
  .copy{min-height:101px;padding-top:10px}
  .workspace{inset:98px 0 0}
  .copy h1{font-size:28px}
  .passage-cheque,.veil-cheque{height:190px}
  .cheque-title{font-size:21px}
  .passage-field,.veil-stage{height:70%}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="wordmark">
      <small>COUPLE · RITUAL LAB</small>
      <strong>Passage + Voile</strong>
    </div>
    <button class="icon-btn" id="reset" aria-label="Réinitialiser">↻</button>
  </header>

  <div class="switch">
    <button id="sendMode">Envoi · Passage</button>
    <button id="receiveMode" class="active">Ouverture · Voile</button>
  </div>

  <main class="scene" id="scene"></main>

  <footer class="footer">Prototype tactile autonome · aucune donnée envoyée</footer>
</div>

<script>
(() => {
  const scene=document.getElementById('scene');
  const reset=document.getElementById('reset');
  const sendMode=document.getElementById('sendMode');
  const receiveMode=document.getElementById('receiveMode');

  const clamp=(v,min=0,max=1)=>Math.max(min,Math.min(max,v));
  const haptic=(p=12)=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(_){}};

  let mode='receive';
  let disposers=[];

  const listen=(el,type,fn,opts)=>{
    el.addEventListener(type,fn,opts);
    disposers.push(()=>el.removeEventListener(type,fn,opts));
  };
  const clear=()=>{disposers.splice(0).forEach(fn=>fn())};

  function chequeHTML(){
    return `
      <article class="cheque">
        <div class="cheque-stub"><span>COUPLE · 01</span></div>
        <div class="cheque-perf"></div>
        <div class="cheque-body">
          <div class="cheque-kicker">BON POUR</div>
          <div class="cheque-title">Un dîner rien que nous deux</div>
          <div class="cheque-message">Je m’occupe de tout. Tu n’as qu’à être là.</div>
          <div class="cheque-meta"><span>POUR · TOI</span><span>DE · MOI</span></div>
        </div>
        <div class="cheque-mark">♡</div>
      </article>`;
  }

  function shell(copyTitle,copyText,inner){
    return `
      <div class="copy">
        <div class="eyebrow">${mode==='send'?'LE PASSAGE':'LE VOILE'}</div>
        <h1>${copyTitle}</h1>
        <p>${copyText}</p>
      </div>
      <div class="workspace">
        ${inner}
        <div class="progress-shell" id="progress"><i></i></div>
        <div class="hint" id="hint"></div>
      </div>`;
  }

  function setHint(text,show=true){
    const el=document.getElementById('hint');
    if(!el)return;
    el.textContent=text;
    el.classList.toggle('hidden',!show);
  }
  function setCopy(title,text){
    const h=scene.querySelector('.copy h1');
    const p=scene.querySelector('.copy p');
    if(h)h.textContent=title;
    if(p)p.textContent=text;
  }
  function setProgress(p,show=true){
    const shell=document.getElementById('progress');
    const fill=shell?.querySelector('i');
    if(shell)shell.classList.toggle('visible',show);
    if(fill)fill.style.width=`${clamp(p)*100}%`;
  }

  function renderPassage(){
    clear();
    scene.innerHTML=shell(
      'Fais-le passer.',
      'Le bon quitte ton espace pour rejoindre le sien.',
      `
      <div class="passage" id="passage">
        <div class="threshold">
          <div class="threshold-glow"></div>
          <div class="threshold-line"></div>
          <div class="threshold-label">LAISSER PASSER</div>
        </div>
        <div class="passage-field">
          <div class="passage-arch"></div>
          <div class="passage-resistance"></div>
          <div class="passage-cheque" id="passageCheque">${chequeHTML()}</div>
        </div>
        <div class="passage-complete" id="passageComplete">
          <div class="sigil">♡</div>
          <h2>C’est envoyé.</h2>
          <p>Ton attention est passée de l’autre côté.</p>
        </div>
      </div>`
    );

    const passage=document.getElementById('passage');
    const card=document.getElementById('passageCheque');
    const complete=document.getElementById('passageComplete');

    let pointer=null,startY=0,p=0,locked=false,thresholdHit=false;
    setHint('Pousse le bon vers le haut');

    const setP=v=>{
      p=clamp(v);
      passage.style.setProperty('--p',p.toFixed(4));
      setProgress(p,p>0.02);
      if(p<.25)setHint('Le bon se rapproche du passage…');
      else if(p<.55)setHint('Continue vers le haut');
      else if(p<.76)setHint('Tu sens une légère résistance…');
      else setHint('Encore un peu…');
      if(p>=.76&&!thresholdHit){
        thresholdHit=true;
        haptic(10);
      }
      if(p<.70)thresholdHit=false;
    };

    function animateTo(target,duration,done){
      locked=true;
      const from=p,t0=performance.now();
      const ease=t=>1-Math.pow(1-t,3);
      const frame=now=>{
        const t=clamp((now-t0)/duration);
        setP(from+(target-from)*ease(t));
        if(t<1)requestAnimationFrame(frame);
        else{locked=false;done&&done()}
      };
      requestAnimationFrame(frame);
    }

    listen(card,'pointerdown',e=>{
      if(locked)return;
      e.preventDefault();
      pointer=e.pointerId;startY=e.clientY;
      try{card.setPointerCapture(pointer)}catch(_){}
      setCopy('Fais-le passer.','Un geste simple. Le téléphone devient la frontière.');
    });
    listen(card,'pointermove',e=>{
      if(pointer!==e.pointerId||locked)return;
      const dy=Math.max(0,startY-e.clientY);
      const raw=dy/300;
      // résistance entre 62 et 80 %
      let adjusted=raw;
      if(raw>.62&&raw<.80){
        adjusted=.62+(raw-.62)*.62;
      }else if(raw>=.80){
        adjusted=.7316+(raw-.80)*1.34;
      }
      setP(adjusted);
    });

    const finish=e=>{
      if(pointer!==e.pointerId||locked)return;
      try{card.releasePointerCapture(pointer)}catch(_){}
      pointer=null;
      if(p>=.78){
        haptic([10,22,18]);
        setHint('',false);
        setCopy('Il est en chemin.','Le bon franchit la limite et quitte ton espace.');
        animateTo(1,620,()=>{
          complete.classList.add('visible');
          setProgress(1,false);
          setCopy('C’est envoyé.','Simplement. Sans animation superflue.');
        });
      }else{
        animateTo(0,330,()=>{
          setProgress(0,false);
          setHint('Pousse le bon vers le haut');
          setCopy('Fais-le passer.','Le bon quitte ton espace pour rejoindre le sien.');
        });
      }
    };
    listen(card,'pointerup',finish);
    listen(card,'pointercancel',finish);
    listen(card,'lostpointercapture',e=>{
      if(pointer!==null&&!locked){
        pointer=null;
        animateTo(0,300,()=>{
          setProgress(0,false);
          setHint('Pousse le bon vers le haut');
        });
      }
    });
  }

  function renderVoile(){
    clear();
    scene.innerHTML=shell(
      'Quelque chose t’attend.',
      'Le bon est déjà là. Le voile conserve encore le secret.',
      `
      <div class="veil" id="veil">
        <div class="veil-stage">
          <div class="veil-cheque">${chequeHTML()}</div>
          <div class="veil-category">ROMANTIQUE</div>
          <div class="veil-sheet" id="veilSheet"></div>
          <div class="veil-grip"></div>
        </div>
        <div class="veil-final" id="veilFinal">${chequeHTML()}</div>
        <div class="veil-actions" id="veilActions">
          <button id="replayVeil">Rejouer</button>
        </div>
      </div>`
    );

    const veil=document.getElementById('veil');
    const sheet=document.getElementById('veilSheet');
    const final=document.getElementById('veilFinal');
    const actions=document.getElementById('veilActions');

    let pointer=null,startX=0,p=0,locked=false,thresholdHit=false;
    setHint('Fais glisser le voile vers la droite');

    const setP=v=>{
      p=clamp(v);
      veil.style.setProperty('--p',p.toFixed(4));
      setProgress(p,p>.02);

      if(p<.18){
        setCopy('Quelque chose t’attend.','Le bon est encore protégé par le voile.');
        setHint('Fais glisser doucement');
      }else if(p<.38){
        setCopy('Un premier indice.','Romantique.');
        setHint('Continue…');
      }else if(p<.58){
        setCopy('BON POUR…','Le cadeau commence à prendre forme.');
        setHint('Le titre arrive…');
      }else if(p<.76){
        setCopy('Presque à toi.','Le titre et le message se révèlent.');
        setHint('Encore un peu…');
      }else{
        setCopy('Le voile est prêt à céder.','Un dernier geste suffit.');
        setHint('Libère le voile');
      }

      if(p>=.76&&!thresholdHit){
        thresholdHit=true;
        haptic(10);
      }
      if(p<.69)thresholdHit=false;
    };

    function animateTo(target,duration,done){
      locked=true;
      const from=p,t0=performance.now();
      const ease=t=>1-Math.pow(1-t,3);
      const frame=now=>{
        const t=clamp((now-t0)/duration);
        setP(from+(target-from)*ease(t));
        if(t<1)requestAnimationFrame(frame);
        else{locked=false;done&&done()}
      };
      requestAnimationFrame(frame);
    }

    listen(sheet,'pointerdown',e=>{
      if(locked)return;
      e.preventDefault();
      pointer=e.pointerId;startX=e.clientX;
      try{sheet.setPointerCapture(pointer)}catch(_){}
    });
    listen(sheet,'pointermove',e=>{
      if(pointer!==e.pointerId||locked)return;
      const dx=Math.max(0,e.clientX-startX);
      const raw=dx/285;
      let adjusted=raw;
      if(raw>.63&&raw<.81){
        adjusted=.63+(raw-.63)*.66;
      }else if(raw>=.81){
        adjusted=.7488+(raw-.81)*1.28;
      }
      setP(adjusted);
    });

    const finish=e=>{
      if(pointer!==e.pointerId||locked)return;
      try{sheet.releasePointerCapture(pointer)}catch(_){}
      pointer=null;
      if(p>=.78){
        haptic([10,24,18]);
        setHint('',false);
        animateTo(1,560,()=>{
          final.classList.add('visible');
          actions.classList.add('visible');
          setProgress(1,false);
          setCopy('Le bon est à toi.','Le voile disparaît. Il ne reste que l’attention qui t’était destinée.');
        });
      }else{
        animateTo(0,330,()=>{
          setProgress(0,false);
          setHint('Fais glisser le voile vers la droite');
          setCopy('Quelque chose t’attend.','Le bon est déjà là. Le voile conserve encore le secret.');
        });
      }
    };
    listen(sheet,'pointerup',finish);
    listen(sheet,'pointercancel',finish);
    listen(sheet,'lostpointercapture',e=>{
      if(pointer!==null&&!locked){
        pointer=null;
        animateTo(0,300,()=>{
          setProgress(0,false);
          setHint('Fais glisser le voile vers la droite');
        });
      }
    });

    listen(document.getElementById('replayVeil'),'click',renderVoile);
  }

  function setMode(next){
    mode=next;
    sendMode.classList.toggle('active',mode==='send');
    receiveMode.classList.toggle('active',mode==='receive');
    mode==='send'?renderPassage():renderVoile();
  }

  listen(sendMode,'click',()=>setMode('send'));
  listen(receiveMode,'click',()=>setMode('receive'));
  listen(reset,'click',()=>mode==='send'?renderPassage():renderVoile());

  renderVoile();
})();
</script>
</body>
</html>
