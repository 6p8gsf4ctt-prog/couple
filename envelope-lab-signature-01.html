<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F0E7">
<title>Couple — Scratch Lab · Signature 01</title>
<style>
:root{--ivory:#F5F0E7;--paper:#FCF8F0;--graphite:#302B28;--muted:#81746C;--burgundy:#7A343E;--blush:#DCA39C;--champagne:#D8BF99;--line:#DCCDBE;--ease:cubic-bezier(.22,.82,.24,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ivory);color:var(--graphite)}
body{min-height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:radial-gradient(circle at 50% -8%,rgba(255,255,255,.88),transparent 38%),linear-gradient(180deg,#F8F3EA 0%,#F2E9DE 100%)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}.app{min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}.topbar{width:min(560px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:30}.brand small{display:block;color:var(--burgundy);font-size:8px;letter-spacing:.22em;font-weight:800}.brand strong{display:block;margin-top:3px;font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:400}.reset{width:40px;height:40px;border-radius:50%;border:1px solid rgba(122,52,62,.15);background:rgba(252,248,240,.75);color:var(--burgundy);display:grid;place-items:center}.reset:active{transform:scale(.96)}
.switch{justify-self:center;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;border-radius:22px;background:rgba(223,211,199,.52);border:1px solid rgba(191,171,153,.34)}.switch button{min-width:112px;height:38px;border:0;border-radius:18px;background:transparent;color:var(--muted);font-size:12px}.switch button.active{color:var(--burgundy);font-weight:750;background:rgba(252,248,240,.94);box-shadow:0 4px 12px rgba(70,47,35,.055)}
.scene{width:min(560px,100%);height:100%;min-height:0;margin:0 auto;position:relative;overflow:hidden}.copy{min-height:122px;padding:17px 8px 0;text-align:center;position:relative;z-index:10}.eyebrow{color:var(--burgundy);font-size:8px;letter-spacing:.20em;font-weight:800}.copy h1{margin:9px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,7vw,39px);font-weight:400;line-height:1.03;letter-spacing:-.02em}.copy p{margin:8px auto 0;max-width:385px;color:var(--muted);font-size:12px;line-height:1.46}.workspace{position:absolute;inset:120px 0 0;display:grid;place-items:center;touch-action:none}.ticket-shell{position:relative;width:min(91%,420px);height:247px;transform:translateY(-18px)}
.ticket{position:absolute;inset:0;display:grid;grid-template-columns:58px 1px 1fr;background:radial-gradient(circle at 13% 18%,rgba(123,89,65,.035) 0 1px,transparent 1.3px),radial-gradient(circle at 70% 66%,rgba(255,255,255,.56) 0 1px,transparent 1.3px),linear-gradient(180deg,#FCF8F0,#FAF5EB);border:1px solid #E0D0C0;border-radius:25px;box-shadow:0 22px 42px rgba(67,45,31,.12);overflow:visible}.stub{border-radius:24px 0 0 24px;background:linear-gradient(180deg,rgba(220,163,156,.16),rgba(216,191,153,.08));display:flex;align-items:center;justify-content:center;overflow:hidden}.stub span{transform:rotate(-90deg);white-space:nowrap;color:var(--burgundy);font-size:7px;letter-spacing:.22em}.perf{margin:10px 0;border-left:1px dashed #C7B3A4}.ticket-body{padding:19px 18px 15px;display:grid;align-content:center;text-align:center;min-width:0}.kicker{font-family:Georgia,"Times New Roman",serif;color:var(--burgundy);font-size:20px;letter-spacing:.14em}.title{margin-top:11px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:27px;line-height:1.07}.message{margin-top:10px;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--muted);font-size:12px;line-height:1.38}.meta{margin-top:15px;display:flex;justify-content:space-between;gap:8px;color:#897A70;font-size:7px;letter-spacing:.09em}.mark{position:absolute;right:-15px;top:44%;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#E5B4AD,#CC807C);color:#FFF8F2;border:1px solid rgba(141,76,76,.12);display:grid;place-items:center;font-size:19px;box-shadow:0 7px 14px rgba(99,52,52,.11)}
.scratch-zone{position:absolute;z-index:10;left:71px;right:14px;top:14px;bottom:14px;border-radius:18px;overflow:hidden;isolation:isolate}.scratch-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.scratch-label{position:absolute;z-index:3;inset:0;pointer-events:none;display:grid;place-items:center;text-align:center;color:rgba(91,66,51,.58);transition:opacity .2s ease}.scratch-label strong{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:17px;letter-spacing:.08em}.scratch-label span{display:block;margin-top:7px;font-size:9px;letter-spacing:.13em}.scratch-label.hidden{opacity:0}.spark{position:fixed;z-index:100;width:4px;height:4px;border-radius:50%;background:#C6AA82;pointer-events:none;animation:spark .48s ease-out forwards}@keyframes spark{from{opacity:.65;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}
.progress{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);width:162px;height:3px;border-radius:3px;overflow:hidden;background:rgba(177,154,137,.19)}.progress i{display:block;width:0;height:100%;background:var(--burgundy);border-radius:3px;transition:width .12s linear}.progress-text{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);color:var(--muted);font-size:9px;letter-spacing:.08em;white-space:nowrap}.final-copy{position:absolute;z-index:20;left:50%;bottom:8px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .35s ease;color:var(--burgundy);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}.final-copy.visible{opacity:1}
.cover-layer{position:absolute;z-index:12;left:71px;right:14px;top:14px;bottom:14px;border-radius:18px;overflow:hidden;pointer-events:none}.cover-fill{position:absolute;inset:0;transform:scaleY(0);transform-origin:bottom;background:radial-gradient(circle at 28% 26%,rgba(255,255,255,.42),transparent 19%),repeating-linear-gradient(115deg,rgba(104,77,56,.025) 0 1px,transparent 1px 5px),linear-gradient(135deg,#E7D9C1 0%,#D3BB92 43%,#E4D3B7 72%,#C9AC7B 100%);transition:transform 1.15s var(--ease)}.cover-layer.active .cover-fill{transform:scaleY(1)}.prepare-actions{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:grid;gap:9px;width:min(90%,330px)}.action{min-height:48px;border-radius:24px;border:1px solid rgba(122,52,62,.16);background:var(--burgundy);color:white;font-weight:750}.action.secondary{background:rgba(252,248,240,.74);color:var(--burgundy)}.action:disabled{opacity:.45}.send-confirm{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s ease;background:linear-gradient(180deg,rgba(245,240,231,.2),rgba(245,240,231,.82))}.send-confirm.visible{opacity:1;pointer-events:auto}.send-confirm-inner{text-align:center}.send-confirm-inner .heart{width:52px;height:52px;border-radius:50%;margin:0 auto 15px;display:grid;place-items:center;border:1px solid rgba(122,52,62,.18);color:var(--burgundy);font-family:Georgia,"Times New Roman",serif;font-size:25px}.send-confirm-inner h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:31px}.send-confirm-inner p{margin:8px 0 0;color:var(--muted);font-size:12px}.footer{width:min(560px,100%);margin:0 auto;text-align:center;color:var(--muted);font-size:8px;letter-spacing:.07em;padding-top:6px}@media(max-height:710px){.copy{min-height:102px;padding-top:10px}.workspace{inset:100px 0 0}.ticket-shell{height:224px;transform:translateY(-11px)}.title{font-size:23px}.ticket-body{padding-top:15px;padding-bottom:12px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><small>COUPLE · SCRATCH LAB</small><strong>Signature 01 · test 1.1</strong></div><button class="reset" id="reset" aria-label="Réinitialiser">↻</button></header><div class="switch"><button id="prepareMode">Envoi</button><button id="scratchMode" class="active">Ouverture</button></div><main class="scene" id="scene"></main><footer class="footer">Prototype tactile autonome · pensé pour iPhone</footer></div>
<script>
(()=>{
const scene=document.getElementById('scene'),reset=document.getElementById('reset'),prepareMode=document.getElementById('prepareMode'),scratchMode=document.getElementById('scratchMode');let mode='scratch',listeners=[];const on=(el,t,fn,o)=>{el.addEventListener(t,fn,o);listeners.push(()=>el.removeEventListener(t,fn,o))},clear=()=>listeners.splice(0).forEach(fn=>fn()),haptic=(p=12)=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(_){}};
function ticketHTML(){return `<article class="ticket"><div class="stub"><span>COUPLE · 01</span></div><div class="perf"></div><div class="ticket-body"><div class="kicker">BON POUR</div><div class="title">Un dîner rien que nous deux</div><div class="message">Je m’occupe de tout. Tu n’as qu’à être là.</div><div class="meta"><span>POUR · TOI</span><span>DE · MOI</span></div></div><div class="mark">♡</div></article>`}
function renderScratch(){clear();scene.innerHTML=`<div class="copy"><div class="eyebrow">À GRATTER</div><h1>Un bon t’attend.</h1><p>Gratte la matière avec ton doigt. Le cadeau se révèle progressivement.</p></div><div class="workspace"><div class="ticket-shell">${ticketHTML()}<div class="scratch-zone" id="scratchZone"><canvas class="scratch-canvas" id="scratchCanvas"></canvas><div class="scratch-label" id="scratchLabel"><div><strong>GRATTE ICI</strong><span>UN MOMENT À DÉCOUVRIR</span></div></div></div></div><div class="progress"><i id="progressFill"></i></div><div class="progress-text" id="progressText">Fais glisser ton doigt sur la matière</div><div class="final-copy" id="finalCopy">Le bon est à toi.</div></div>`;
const canvas=document.getElementById('scratchCanvas'),zone=document.getElementById('scratchZone'),label=document.getElementById('scratchLabel'),fill=document.getElementById('progressFill'),progressText=document.getElementById('progressText'),finalCopy=document.getElementById('finalCopy');let ctx,drawing=false,last=null,completed=false,thresholdHaptic=false,checkCounter=0;const dpr=Math.min(window.devicePixelRatio||1,2);
function drawCover(){const r=zone.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#E8DCC7');g.addColorStop(.38,'#D3BC94');g.addColorStop(.70,'#E5D5BA');g.addColorStop(1,'#C9AD7E');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.15;for(let i=0;i<280;i++){const x=Math.random()*w,y=Math.random()*h,rr=Math.random()*.7+.2;ctx.fillStyle=Math.random()>.5?'#FFF8EC':'#A98C68';ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(104,78,58,.28)';ctx.font='600 10px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillText('COUPLE',w/2,h/2+4)}
function pt(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function scratch(a,b){if(!ctx)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=30;ctx.strokeStyle='#000';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,16,0,Math.PI*2);ctx.fill();ctx.restore()}
function particles(e){if(Math.random()>.48)return;for(let i=0;i<2;i++){const s=document.createElement('i');s.className='spark';s.style.left=(e.clientX+Math.random()*8-4)+'px';s.style.top=(e.clientY+Math.random()*8-4)+'px';s.style.setProperty('--dx',(Math.random()*24-12)+'px');s.style.setProperty('--dy',(Math.random()*18+8)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),520)}}
function ratio(){const w=canvas.width,h=canvas.height;if(!w||!h||!ctx)return 0;const d=ctx.getImageData(0,0,w,h).data;let c=0,n=0,step=16;for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){n++;if(d[(y*w+x)*4+3]<30)c++}return n?c/n:0}
function update(force=false){if(completed)return;checkCounter++;if(!force&&checkCounter%3!==0)return;const r=ratio(),pct=Math.min(100,Math.round(r*100));fill.style.width=pct+'%';if(r>.12)label.classList.add('hidden');progressText.textContent=r<.28?'Continue…':r<.52?'Le titre apparaît…':r<.70?'Encore un peu…':'Presque découvert…';if(r>=.68&&!thresholdHaptic){thresholdHaptic=true;haptic(10)}if(r>=.82){completed=true;haptic([10,22,16]);canvas.style.transition='opacity .42s ease';canvas.style.opacity='0';label.classList.add('hidden');fill.style.width='100%';progressText.textContent='Révélation complète';finalCopy.classList.add('visible');setTimeout(()=>canvas.style.pointerEvents='none',430)}}
on(canvas,'pointerdown',e=>{if(completed)return;e.preventDefault();drawing=true;last=pt(e);scratch(last,last);particles(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}update(true)});on(canvas,'pointermove',e=>{if(!drawing||completed)return;e.preventDefault();const p=pt(e);scratch(last,p);last=p;particles(e);update()});const end=e=>{if(!drawing)return;drawing=false;last=null;try{canvas.releasePointerCapture(e.pointerId)}catch(_){}update(true)};on(canvas,'pointerup',end);on(canvas,'pointercancel',end);on(canvas,'lostpointercapture',()=>{drawing=false;last=null;update(true)});requestAnimationFrame(drawCover)}
function renderPrepare(){clear();scene.innerHTML=`<div class="copy"><div class="eyebrow">PRÉPARER LE BON</div><h1>Garde encore la surprise.</h1><p>Une matière à gratter vient recouvrir le contenu avant l’envoi.</p></div><div class="workspace"><div class="ticket-shell">${ticketHTML()}<div class="cover-layer" id="coverLayer"><div class="cover-fill"></div></div></div><div class="prepare-actions"><button class="action" id="coverBtn">Masquer le bon</button><button class="action secondary" id="sendBtn" disabled>Envoyer</button></div><div class="send-confirm" id="sendConfirm"><div class="send-confirm-inner"><div class="heart">♡</div><h2>C’est envoyé.</h2><p>Le bon attend maintenant d’être gratté.</p></div></div></div>`;const coverLayer=document.getElementById('coverLayer'),coverBtn=document.getElementById('coverBtn'),sendBtn=document.getElementById('sendBtn'),confirm=document.getElementById('sendConfirm');let covered=false;on(coverBtn,'click',()=>{if(covered)return;covered=true;coverLayer.classList.add('active');coverBtn.textContent='Bon masqué';coverBtn.disabled=true;setTimeout(()=>{haptic(10);sendBtn.disabled=false;sendBtn.classList.remove('secondary')},1050)});on(sendBtn,'click',()=>{if(!covered)return;haptic([8,20,14]);confirm.classList.add('visible')})}
function setMode(next){mode=next;prepareMode.classList.toggle('active',mode==='prepare');scratchMode.classList.toggle('active',mode==='scratch');mode==='prepare'?renderPrepare():renderScratch()}prepareMode.addEventListener('click',()=>setMode('prepare'));
scratchMode.addEventListener('click',()=>setMode('scratch'));
reset.addEventListener('click',()=>mode==='prepare'?renderPrepare():renderScratch());
renderScratch();
})();
</script>
</body>
</html>
