<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ivory);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% -15%,rgba(255,255,255,.82),transparent 42%),linear-gradient(180deg,#F7F2E9 0%,#F1E9DE 100%)}button{font:inherit;color:inherit}
.lab{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(16px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}.topbar{width:min(560px,100%);margin:0 auto;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;z-index:80}.brand small{display:block;font-size:9px;letter-spacing:.22em;color:var(--burgundy);font-weight:750}.brand strong{display:block;margin-top:3px;font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:400}.reset{width:40px;height:40px;border-radius:50%;border:1px solid rgba(116,52,61,.16);background:rgba(252,248,240,.72);display:grid;place-items:center;color:var(--burgundy);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.reset:active{transform:scale(.96)}

.scene{position:relative;min-height:0;height:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.copy{min-height:116px;text-align:center;padding:17px 10px 0;position:relative;z-index:40}.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid rgba(116,52,61,.18);font-family:Georgia,"Times New Roman",serif;color:var(--burgundy);font-size:11px;background:rgba(252,248,240,.45)}.copy h1{margin:10px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,7.2vw,39px);line-height:1.02;font-weight:400;letter-spacing:-.02em}.copy p{margin:9px auto 0;max-width:390px;color:var(--muted);font-size:12px;line-height:1.45}.object-zone{position:relative;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}.hint{position:absolute;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);min-width:max-content;padding:8px 13px;border-radius:16px;background:rgba(252,248,240,.76);border:1px solid rgba(203,184,166,.50);color:var(--burgundy);font-size:10px;letter-spacing:.06em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .25s ease,transform .25s ease}.hint.hidden{opacity:0;transform:translate(-50%,5px);pointer-events:none}.footer{width:min(560px,100%);margin:0 auto;padding-top:7px;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.07em}
.object{--lift:0;--sealX:0px;--sealY:0px;--sealR:0deg;--flapP:0;--ticketP:0;--envDrop:0px;position:absolute;left:50%;top:51%;width:min(92vw,410px);height:min(62vw,276px);max-height:276px;min-height:214px;transform:translate(-50%,-50%) translateY(calc(var(--lift)*-3px));filter:drop-shadow(0 calc(17px + var(--lift)*4px) calc(23px + var(--lift)*3px) rgba(69,45,31,.13));transition:filter .18s ease,transform .18s ease;perspective:1000px;isolation:isolate}.envelope-group{position:absolute;inset:0;transform:translateY(var(--envDrop));transition:opacity .42s ease,transform .58s var(--ease)}.paper-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.back{z-index:1}.ticket{position:absolute;z-index:4;left:10%;right:10%;top:24%;height:70%;transform:translateY(calc((1 - var(--ticketP))*80px - var(--ticketP)*198px)) scale(calc(.91 + var(--ticketP)*.07));transform-origin:center top;opacity:calc(.66 + var(--ticketP)*.34);will-change:transform,opacity}.ticket-card{position:absolute;inset:0;display:grid;grid-template-columns:52px 1px 1fr;background:radial-gradient(circle at 12% 12%,rgba(122,91,66,.035) 0 1px,transparent 1.2px),radial-gradient(circle at 71% 67%,rgba(255,255,255,.56) 0 1px,transparent 1.2px),#FCF8F0;border:1px solid #E0D0C0;border-radius:19px;overflow:hidden;box-shadow:0 14px 28px rgba(66,44,31,.11)}.stub{overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(199,129,125,.13),rgba(215,190,151,.07))}.stub span{transform:rotate(-90deg);white-space:nowrap;font-size:7px;letter-spacing:.20em;color:var(--burgundy)}.perf{margin:8px 0;border-left:1px dashed #C7B4A4}.ticket-body{min-width:0;padding:14px 15px 12px;text-align:center;display:grid;align-content:center}.ticket-kicker{font-family:Georgia,"Times New Roman",serif;font-size:16px;letter-spacing:.13em;color:var(--burgundy)}.ticket-title{margin-top:9px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:22px;line-height:1.05}.ticket-message{margin-top:8px;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--muted);font-size:11px;line-height:1.35}.ticket-meta{margin-top:10px;display:flex;justify-content:space-between;gap:8px;color:#8B7B70;font-size:7px;letter-spacing:.08em}.pocket{z-index:7;pointer-events:none}.flap{position:absolute;z-index:8;left:2.1%;right:2.1%;top:7%;height:52%;transform-origin:50% 3%;transform:translateY(calc(var(--flapP)*-83%)) rotateX(calc(var(--flapP)*178deg));transform-style:preserve-3d;will-change:transform}.flap svg{width:100%;height:100%;display:block;overflow:visible}.flap-handle{position:absolute;z-index:14;left:24%;right:24%;top:2%;height:55%;border:0;background:transparent;touch-action:none;display:none}.object.seal-free .flap-handle{display:block}.seal{position:absolute;z-index:16;left:50%;top:51%;width:70px;height:70px;transform:translate(-50%,-50%) translate(var(--sealX),var(--sealY)) rotate(var(--sealR));border:0;background:transparent;padding:0;touch-action:none;transition:filter .18s ease}.seal svg{display:block;width:100%;height:100%;overflow:visible}.object.seal-armed .seal{filter:brightness(.98) saturate(1.06)}.object.seal-broken .seal{pointer-events:none;transition:transform .42s var(--ease),opacity .38s ease;transform:translate(-50%,-50%) translate(46px,62px) rotate(13deg) scale(.94);opacity:.92}.object.revealed .envelope-group{transform:translateY(82px);opacity:0}.object.revealed .ticket{z-index:30;transform:translateY(-228px) scale(1);opacity:1;transition:transform .58s var(--ease),opacity .35s ease}.object.revealed{filter:drop-shadow(0 18px 26px rgba(69,45,31,.08))}.final-actions{position:absolute;z-index:70;left:50%;bottom:16px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .35s ease;text-align:center}.final-actions.visible{opacity:1;pointer-events:auto}.final-actions button{height:38px;padding:0 15px;border-radius:18px;border:1px solid rgba(116,52,61,.18);background:rgba(252,248,240,.82);color:var(--burgundy);font-size:11px}.progress{position:absolute;z-index:50;left:50%;bottom:58px;transform:translateX(-50%);width:148px;height:2px;background:rgba(174,153,136,.25);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s ease}.progress i{display:block;width:0;height:100%;background:var(--burgundy)}.progress.visible{opacity:1}
.send-scene .object{top:53%}.send-scene .ticket{--sendP:0;z-index:10;transform:translateY(calc(-208px + var(--sendP)*196px)) scale(calc(1 - var(--sendP)*.05));opacity:1}.send-scene .seal{opacity:0;pointer-events:none;transform:translate(-50%,-50%) translateY(-42px) scale(.82)}.send-scene .object.stamp-ready .seal{opacity:1;pointer-events:auto;transition:opacity .3s ease,transform .42s var(--ease);transform:translate(-50%,-50%) scale(1)}.send-scene .object.sent{transform:translate(-50%,-48%) scale(.95);opacity:0;transition:transform .72s var(--ease),opacity .58s .12s ease}.send-complete{position:absolute;z-index:70;left:50%;top:52%;transform:translate(-50%,-50%);width:100%;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s ease}.send-complete.visible{opacity:1;pointer-events:auto}.send-complete h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px}.send-complete p{margin:8px 0 0;color:var(--muted);font-size:12px}
@media(prefers-reduced-motion:reduce){.object,.envelope-group,.object.revealed .ticket,.object.seal-broken .seal,.send-scene .object.sent{transition-duration:.01ms!important}}@media(max-height:700px){.copy{min-height:94px;padding-top:10px}.copy h1{font-size:27px}.copy p{margin-top:5px}.object{top:49%;width:min(84vw,365px)}.hint{bottom:8px}}
</style>

<body>
<div class="lab">
  <header class="topbar"><div class="brand"><small>COUPLE · MOTION LAB</small><strong>Envelope — Signature 01</strong></div><button class="reset" id="reset" aria-label="Réinitialiser">↻</button></header>
  <main class="stage-wrap"><div class="mode-switch"><button id="modeReceive" class="active">Réception</button><button id="modeSend">Envoi</button></div><section class="scene" id="scene"></section></main>
  <footer class="footer">Prototype autonome · gestes pensés pour iPhone</footer>
</div>
<script>
(()=>{
const scene=document.getElementById('scene'),resetBtn=document.getElementById('reset'),receiveBtn=document.getElementById('modeReceive'),sendBtn=document.getElementById('modeSend');const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));const haptic=(p=16)=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(_){}};let mode='receive',cleanup=[];const on=(el,t,fn,o)=>{el.addEventListener(t,fn,o);cleanup.push(()=>el.removeEventListener(t,fn,o))};const clearListeners=()=>cleanup.splice(0).forEach(fn=>fn());
function defs(){return `<defs><filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="2" seed="8" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55 0 0 0 0 .44 0 0 0 0 .34 0 0 0 .055 0" result="g"/><feBlend in="SourceGraphic" in2="g" mode="multiply"/></filter><linearGradient id="backPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E8D4"/><stop offset=".55" stop-color="#EED8BE"/><stop offset="1" stop-color="#E6CDB0"/></linearGradient><linearGradient id="frontPaper" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#F8E9D7"/><stop offset=".7" stop-color="#EED8BF"/><stop offset="1" stop-color="#E8CEB2"/></linearGradient><linearGradient id="lining" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8BEA0"/><stop offset="1" stop-color="#CDAE8D"/></linearGradient></defs>`}
function backSVG(){return `<svg class="paper-svg back" viewBox="0 0 410 276" preserveAspectRatio="none">${defs()}<rect x="8" y="18" width="394" height="250" rx="25" fill="url(#backPaper)" stroke="#D4BCA3" filter="url(#paperNoise)"/><path d="M24 42 Q205 192 386 42 L386 136 Q205 244 24 136 Z" fill="url(#lining)" opacity=".84"/><path d="M24 42 Q205 193 386 42" fill="none" stroke="#B99777" stroke-opacity=".18"/></svg>`}
function pocketSVG(){return `<svg class="paper-svg pocket" viewBox="0 0 410 276" preserveAspectRatio="none">${defs()}<path d="M8 111 L205 243 L402 111 L402 243 Q402 268 377 268 L33 268 Q8 268 8 243 Z" fill="url(#frontPaper)" stroke="#D4BCA3" filter="url(#paperNoise)"/><path d="M8 111 L205 243" stroke="#C6AA90" stroke-opacity=".43"/><path d="M402 111 L205 243" stroke="#C6AA90" stroke-opacity=".43"/><path d="M85 268 L205 202 L325 268" fill="none" stroke="#D0B69C" stroke-opacity=".30"/><text x="369" y="245" text-anchor="end" font-size="7" letter-spacing="2.1" fill="#8D7B6E">COUPLE</text></svg>`}
function flapSVG(){return `<svg viewBox="0 0 394 144" preserveAspectRatio="none">${defs()}<path d="M0 0 H394 L197 144 Z" fill="url(#frontPaper)" stroke="#D4BCA3" filter="url(#paperNoise)"/><path d="M14 8 H380" stroke="#FFF" stroke-opacity=".36"/><path d="M72 25 H322" stroke="#74343D" stroke-width=".75" stroke-opacity=".42"/></svg>`}
function sealSVG(){return `<svg viewBox="0 0 80 80"><defs><radialGradient id="wax" cx=".31" cy=".24" r=".82"><stop offset="0" stop-color="#EFC0B8"/><stop offset=".48" stop-color="#D98B87"/><stop offset="1" stop-color="#B85F66"/></radialGradient><filter id="waxShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#6B3238" flood-opacity=".26"/></filter></defs><path d="M39 5 C49 4 57 8 62 15 C70 18 74 26 72 35 C77 43 72 52 67 57 C65 67 55 72 47 71 C40 77 29 74 24 69 C14 69 8 61 9 52 C3 45 5 35 11 29 C10 19 18 12 27 12 C30 7 34 6 39 5Z" fill="url(#wax)" filter="url(#waxShadow)"/><circle cx="40" cy="40" r="23" fill="none" stroke="#9D5057" stroke-opacity=".34"/><path d="M40 51 C34 47 25 41 25 33 C25 28 29 25 33 25 C36 25 39 27 40 30 C42 27 44 25 48 25 C52 25 55 28 55 33 C55 41 46 47 40 51Z" fill="none" stroke="#FFF6F0" stroke-width="2.1"/><ellipse cx="30" cy="20" rx="8" ry="4" fill="#FFE7DF" opacity=".22" transform="rotate(-25 30 20)"/></svg>`}
function ticketHTML(){return `<div class="ticket-card"><div class="stub"><span>CARNET · 01</span></div><div class="perf"></div><div class="ticket-body"><div class="ticket-kicker">BON POUR</div><div class="ticket-title">Un dîner rien que nous deux</div><div class="ticket-message">Je m’occupe de tout. Tu n’as qu’à être là.</div><div class="ticket-meta"><span>POUR · TOI</span><span>DE · MOI</span></div></div></div>`}
function objectHTML(){return `<div class="object" id="object"><div class="envelope-group">${backSVG()}<div class="ticket" id="ticket">${ticketHTML()}</div>${pocketSVG()}<div class="flap" id="flap">${flapSVG()}</div><button class="flap-handle" id="flapHandle" aria-label="Manipuler le rabat"></button><button class="seal" id="seal" aria-label="Manipuler le sceau">${sealSVG()}</button></div></div>`}
function setCopy(step,title,body){const s=document.querySelector('.step'),h=document.querySelector('.copy h1'),p=document.querySelector('.copy p');if(s)s.textContent=String(step);if(h)h.textContent=title;if(p)p.textContent=body}function setHint(t,v=true){const h=document.getElementById('hint');if(!h)return;h.textContent=t;h.classList.toggle('hidden',!v)}function setProgress(p,v=true){const b=document.querySelector('.progress'),f=document.querySelector('.progress i');if(b)b.classList.toggle('visible',v);if(f)f.style.width=`${clamp(p)*100}%`}
function renderReceive(){clearListeners();scene.className='scene receive-scene';scene.innerHTML=`<div class="copy"><span class="step">00</span><h1>Un bon t’attend.</h1><p>Un objet fermé, calme. Rien n’est encore révélé.</p></div><div class="object-zone" id="zone">${objectHTML()}<div class="progress"><i></i></div><div class="hint" id="hint">Pose le doigt sur l’enveloppe</div><div class="final-actions" id="finalActions"><button id="again">Rejouer l’ouverture</button></div></div>`;const obj=document.getElementById('object'),zone=document.getElementById('zone'),seal=document.getElementById('seal'),flapHandle=document.getElementById('flapHandle'),ticket=document.getElementById('ticket'),finalActions=document.getElementById('finalActions');let state='presence',touch=false;
on(zone,'pointerdown',e=>{if(state!=='presence'||e.target.closest('#seal'))return;touch=true;obj.style.setProperty('--lift','1');setCopy('01','Prends contact.','L’enveloppe répond légèrement à ton doigt.');setHint('Le sceau attend au centre')});const contactEnd=()=>{if(touch&&state==='presence'){touch=false;obj.style.setProperty('--lift','0')}};on(zone,'pointerup',contactEnd);on(zone,'pointercancel',contactEnd);
let sp=null,sx=0,sy=0,armed=false,timer=null,sealP=0;on(seal,'pointerdown',e=>{if(state!=='presence'&&state!=='seal')return;e.preventDefault();state='seal';sp=e.pointerId;sx=e.clientX;sy=e.clientY;armed=false;sealP=0;obj.classList.add('seal-armed');obj.style.setProperty('--lift','1');setCopy('03','Libère le sceau.','Maintiens-le un instant, puis tire légèrement vers toi.');setHint('Maintiens…');setProgress(0,true);try{seal.setPointerCapture(e.pointerId)}catch(_){}const t0=performance.now();const tick=()=>{if(state!=='seal'||armed)return;const q=clamp((performance.now()-t0)/300);setProgress(q,true);if(q<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);timer=setTimeout(()=>{armed=true;haptic(8);setHint('Tire le sceau vers le bas')},300)});
on(seal,'pointermove',e=>{if(state!=='seal'||e.pointerId!==sp||!armed)return;const dx=clamp(e.clientX-sx,-18,22),dy=Math.max(0,e.clientY-sy);sealP=clamp(dy/48);obj.style.setProperty('--sealX',`${dx*.25}px`);obj.style.setProperty('--sealY',`${sealP*38}px`);obj.style.setProperty('--sealR',`${sealP*5}deg`);setProgress(sealP,true);if(sealP>.5)setHint('Le papier résiste…');if(sealP>=.72){state='seal-done';obj.classList.remove('seal-armed');obj.classList.add('seal-broken','seal-free');obj.style.setProperty('--sealX','0px');obj.style.setProperty('--sealY','0px');obj.style.setProperty('--sealR','0deg');obj.style.setProperty('--lift','0');setProgress(1,false);setCopy('05','Le rabat est libre.','Le sceau ne retient plus le papier.');setHint('Soulève doucement le rabat');haptic([10,24,18]);try{seal.releasePointerCapture(e.pointerId)}catch(_){}}});
const finishSeal=e=>{if(e.pointerId!==sp)return;if(timer){clearTimeout(timer);timer=null}if(state==='seal'){state='presence';armed=false;obj.classList.remove('seal-armed');obj.style.setProperty('--sealX','0px');obj.style.setProperty('--sealY','0px');obj.style.setProperty('--sealR','0deg');obj.style.setProperty('--lift','0');setProgress(0,false);setCopy('02','Le sceau protège encore le bon.','Il faut le libérer avant d’ouvrir l’enveloppe.');setHint('Maintiens puis tire le sceau')}sp=null};on(seal,'pointerup',finishSeal);on(seal,'pointercancel',finishSeal);on(seal,'lostpointercapture',finishSeal);
let fp=null,fy=0,flapP=0;on(flapHandle,'pointerdown',e=>{if(state!=='seal-done'&&state!=='flap')return;e.preventDefault();state='flap';fp=e.pointerId;fy=e.clientY;setCopy('06','Ouvre l’enveloppe.','Le rabat suit directement ton geste.');setHint('Tire le rabat vers le haut');setProgress(flapP,true);try{flapHandle.setPointerCapture(e.pointerId)}catch(_){}});on(flapHandle,'pointermove',e=>{if(state!=='flap'||e.pointerId!==fp)return;flapP=clamp((fy-e.clientY)/120);obj.style.setProperty('--flapP',flapP);setProgress(flapP,true);if(flapP>.28)setHint('La doublure apparaît…');if(flapP>.56)setHint('BON POUR se dévoile…')});const finishFlap=e=>{if(e.pointerId!==fp)return;if(flapP>=.72){flapP=1;obj.style.setProperty('--flapP','1');obj.classList.add('flap-open');flapHandle.style.display='none';state='ticket';setProgress(1,false);setCopy('07','Le bon est là.','Seulement une première tranche. Le contenu reste à découvrir.');setHint('Prends le bord du bon');haptic(12)}else{flapP=0;obj.style.setProperty('--flapP','0');obj.classList.remove('flap-open');flapHandle.style.display='block';state='seal-done';setProgress(0,false);setHint('Soulève doucement le rabat')}fp=null};on(flapHandle,'pointerup',finishFlap);on(flapHandle,'pointercancel',finishFlap);on(flapHandle,'lostpointercapture',finishFlap);
let tp=null,ty=0,ticketP=0,locked=false;on(ticket,'pointerdown',e=>{if(state!=='ticket'||locked)return;e.preventDefault();tp=e.pointerId;ty=e.clientY;setCopy('08','Prends ton bon.','Le papier se sépare de l’enveloppe.');setHint('Tire doucement vers le haut');setProgress(ticketP,true);try{ticket.setPointerCapture(e.pointerId)}catch(_){}});on(ticket,'pointermove',e=>{if(state!=='ticket'||e.pointerId!==tp||locked)return;ticketP=clamp((ty-e.clientY)/235);obj.style.setProperty('--ticketP',ticketP);setProgress(ticketP,true);if(ticketP<.25)setHint('Le titre commence à apparaître…');else if(ticketP<.52)setHint('Encore doucement…');else if(ticketP<.70)setHint('Le message se révèle…');else setHint('Le point de bascule approche…');obj.style.setProperty('--envDrop',`${Math.max(0,(ticketP-.55)/.45)*22}px`)});const animateP=(from,to,dur,done)=>{locked=true;const st=performance.now(),ease=t=>1-Math.pow(1-t,3);const frame=now=>{const q=clamp((now-st)/dur);ticketP=from+(to-from)*ease(q);obj.style.setProperty('--ticketP',ticketP);setProgress(ticketP,true);if(q<1)requestAnimationFrame(frame);else{locked=false;done&&done()}};requestAnimationFrame(frame)};const finishTicket=e=>{if(e.pointerId!==tp||locked)return;tp=null;if(ticketP>=.70){haptic([12,26,20]);setCopy('10','Le bon est à toi.','L’enveloppe s’efface. Le chèque devient le seul objet important.');setHint('',false);animateP(ticketP,1,520,()=>{obj.classList.add('revealed');setProgress(1,false);setTimeout(()=>{setCopy('12','Découvre ton bon.','Un dîner rien que nous deux.');finalActions.classList.add('visible')},560)})}else{animateP(ticketP,0,320,()=>{obj.style.setProperty('--envDrop','0px');setProgress(0,false);setCopy('07','Le bon est encore protégé.','Relâché avant le seuil, il revient dans l’enveloppe.');setHint('Prends le bord du bon')})}};on(ticket,'pointerup',finishTicket);on(ticket,'pointercancel',finishTicket);on(ticket,'lostpointercapture',finishTicket);on(document.getElementById('again'),'click',renderReceive)}
function renderSend(){clearListeners();scene.className='scene send-scene';scene.innerHTML=`<div class="copy"><span class="step">E1</span><h1>Prépare ton enveloppe.</h1><p>Le même objet, manipulé en sens inverse avant l’envoi.</p></div><div class="object-zone" id="zone">${objectHTML()}<div class="progress"><i></i></div><div class="hint" id="hint">Glisse le chèque dans l’enveloppe</div><div class="send-complete" id="sendComplete"><h2>C’est envoyé.</h2><p>Le bon attend désormais de l’autre côté.</p></div></div>`;const obj=document.getElementById('object'),ticket=document.getElementById('ticket'),flapHandle=document.getElementById('flapHandle'),seal=document.getElementById('seal'),complete=document.getElementById('sendComplete');obj.style.setProperty('--flapP','1');obj.classList.add('seal-free');let phase='insert',pointer=null,startY=0,p=0;const setSendP=v=>{p=clamp(v);ticket.style.setProperty('--sendP',p);setProgress(p,true)};on(ticket,'pointerdown',e=>{if(phase!=='insert')return;e.preventDefault();pointer=e.pointerId;startY=e.clientY;setCopy('E2','Glisse le bon.','Le chèque entre réellement dans l’enveloppe.');setHint('Pousse vers le bas');try{ticket.setPointerCapture(e.pointerId)}catch(_){}});on(ticket,'pointermove',e=>{if(phase!=='insert'||e.pointerId!==pointer)return;setSendP((e.clientY-startY)/175);if(p>.45)setHint('Le papier disparaît dans la poche…')});const finishInsert=e=>{if(e.pointerId!==pointer)return;pointer=null;if(p>=.68){setSendP(1);phase='close';setProgress(1,false);setCopy('E3','Referme ton enveloppe.','Le rabat attend maintenant ton geste.');setHint('Descends le rabat')}else{setSendP(0);setProgress(0,false);setHint('Glisse le chèque dans l’enveloppe')}};on(ticket,'pointerup',finishInsert);on(ticket,'pointercancel',finishInsert);on(ticket,'lostpointercapture',finishInsert);
let fp=null,fy=0,closeP=0;on(flapHandle,'pointerdown',e=>{if(phase!=='close')return;e.preventDefault();fp=e.pointerId;fy=e.clientY;setProgress(0,true);try{flapHandle.setPointerCapture(e.pointerId)}catch(_){}});on(flapHandle,'pointermove',e=>{if(phase!=='close'||e.pointerId!==fp)return;closeP=clamp((e.clientY-fy)/120);obj.style.setProperty('--flapP',1-closeP);setProgress(closeP,true);if(closeP>.45)setHint('Les deux côtés se rejoignent…')});const finishClose=e=>{if(e.pointerId!==fp)return;fp=null;if(closeP>=.72){closeP=1;obj.style.setProperty('--flapP','0');phase='stamp';obj.classList.add('stamp-ready');setProgress(1,false);setCopy('E4','Scelle le bon.','Une pression suffit pour terminer l’objet.');setHint('Maintiens le sceau');haptic(10)}else{closeP=0;obj.style.setProperty('--flapP','1');setProgress(0,false);setHint('Descends le rabat')}};on(flapHandle,'pointerup',finishClose);on(flapHandle,'pointercancel',finishClose);on(flapHandle,'lostpointercapture',finishClose);
let stampTimer=null,done=false;on(seal,'pointerdown',e=>{if(phase!=='stamp'||done)return;e.preventDefault();obj.classList.add('seal-armed');setProgress(0,true);setHint('Presse encore un instant…');const st=performance.now();const tick=()=>{if(done||phase!=='stamp')return;const q=clamp((performance.now()-st)/520);setProgress(q,true);if(q<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);stampTimer=setTimeout(()=>{done=true;phase='ready';obj.classList.remove('seal-armed');setProgress(1,false);haptic([10,22,16]);setCopy('E5','C’est prêt.','L’enveloppe est fermée. Le bon peut partir.');setHint('Touchez l’enveloppe pour envoyer')},520)});const cancelStamp=()=>{if(phase==='stamp'&&!done){if(stampTimer)clearTimeout(stampTimer);obj.classList.remove('seal-armed');setProgress(0,false);setHint('Maintiens le sceau')}};on(seal,'pointerup',cancelStamp);on(seal,'pointercancel',cancelStamp);on(obj,'click',()=>{if(phase!=='ready')return;phase='sent';setHint('',false);obj.classList.add('sent');setTimeout(()=>complete.classList.add('visible'),520)})}
function setMode(next){mode=next;receiveBtn.classList.toggle('active',mode==='receive');sendBtn.classList.toggle('active',mode==='send');mode==='receive'?renderReceive():renderSend()}receiveBtn.addEventListener('click',()=>setMode('receive'));sendBtn.addEventListener('click',()=>setMode('send'));resetBtn.addEventListener('click',()=>mode==='receive'?renderReceive():renderSend());renderReceive();
})();
</script>
