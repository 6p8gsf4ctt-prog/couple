<style>
:root{
  --bg:#100d15;--bg2:#17121d;--panel:#1d1724;--panel2:#251c2e;
  --ink:#fff8ec;--muted:#a99fac;--line:rgba(255,248,236,.12);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.bottom-nav{position:relative;z-index:1000;width:100%;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#120e17;border-top:1px solid rgba(255,248,236,.12);box-shadow:0 -10px 34px rgba(0,0,0,.26);isolation:isolate}

.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.nav-item.active{color:var(--ink)}.nav-item.active svg{stroke:var(--red)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:transparent}.nav-item.active .nav-dot{background:var(--red);box-shadow:0 0 14px var(--red)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{font-size:13px;font-weight:800;letter-spacing:.26em;text-transform:uppercase}.brand i{color:var(--red);font-style:normal}.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.035);display:grid;place-items:center}.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--red2);margin:0 0 10px}.display{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.045em;font-size:clamp(46px,13vw,76px);line-height:.93;margin:0}.display em{font-style:italic;color:var(--red2)}
.lead{font-size:18px;line-height:1.45;color:var(--muted);margin:18px 0 0;max-width:520px}
.hero{padding:12px 0 30px}.hero-orb{height:180px;margin:26px -20px 0;position:relative;overflow:hidden}.orb{position:absolute;border-radius:999px;filter:blur(.1px)}.orb.a{width:220px;height:220px;background:radial-gradient(circle at 35% 30%,#ff8aa0,#ff3f67 44%,#6b1f54 72%,transparent 73%);right:-18px;top:-18px;box-shadow:0 0 70px rgba(255,77,109,.22)}.orb.b{width:150px;height:150px;border:1px solid rgba(255,248,236,.24);right:130px;top:32px}.orb.c{width:80px;height:80px;background:var(--violet);right:178px;top:70px;mix-blend-mode:screen;opacity:.55}
.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:14px}.section-title{font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400;margin:0}.section-link{border:0;background:transparent;color:var(--red2);font-weight:700;padding:8px 0}
.quick-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:12px}.quick{min-height:142px;border:1px solid var(--line);border-radius:24px;padding:18px;text-align:left;background:linear-gradient(145deg,#26182a,#1b1621);position:relative;overflow:hidden}.quick.primary{background:linear-gradient(145deg,#ff4d6d,#a72d65 70%,#562052);border-color:transparent}.quick strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;line-height:1.05}.quick small{display:block;margin-top:9px;color:rgba(255,248,236,.7);line-height:1.35}.quick .plus{position:absolute;right:14px;bottom:6px;font-size:64px;font-weight:200;opacity:.28}
.notice{border:1px solid rgba(255,77,109,.3);background:linear-gradient(135deg,rgba(255,77,109,.15),rgba(139,92,246,.08));border-radius:22px;padding:16px 18px;margin:20px 0}.notice strong{display:block}.notice span{display:block;color:var(--muted);margin-top:5px;font-size:14px;line-height:1.35}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);background:#17121d;border-radius:18px;margin:24px 0}.seg{border:0;background:transparent;color:#8f8593;border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px}.seg.active{background:#2a1f31;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ticket-list{display:grid;gap:16px}.ticket{--accent:var(--red);position:relative;border-radius:28px;padding:22px;min-height:250px;overflow:hidden;background:linear-gradient(145deg,#24172b,#17131c 68%);border:1px solid rgba(255,248,236,.13);box-shadow:var(--shadow)}.ticket::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-70px;background:var(--accent);opacity:.16;filter:blur(2px)}.ticket.violet{--accent:var(--violet)}.ticket.amber{--accent:var(--amber)}.ticket.mint{--accent:var(--mint)}.ticket.red{--accent:var(--red)}
.ticket-month{font-size:11px;font-weight:850;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}.ticket-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8f8593;margin-top:40px}.ticket-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:-.035em;font-weight:400;margin:8px 0 0;max-width:90%}.ticket-message{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#b9afb9;font-size:18px;line-height:1.3;margin:16px 0 0;max-width:90%}.ticket-moment{display:inline-flex;align-items:center;gap:8px;margin-top:24px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;font-weight:750}.ticket-moment::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.ticket-status{position:absolute;right:18px;bottom:18px;font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:#9e94a0}
.ticket.compact{min-height:190px;padding:18px}.ticket.compact .ticket-kicker{margin-top:25px}.ticket.compact .ticket-title{font-size:34px}.ticket.compact .ticket-message{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ticket.compact .ticket-moment{margin-top:16px}
.ticket.used{filter:saturate(.72);opacity:.88}.ticket.used::before{content:"VÉCU";position:absolute;right:18px;top:18px;border:1px solid rgba(255,248,236,.25);border-radius:999px;padding:7px 10px;font-size:9px;letter-spacing:.18em;font-weight:850;z-index:2}.ticket.locked::before{content:"MOMENT CHOISI POUR TOI";position:absolute;right:18px;top:18px;border:1px solid rgba(255,202,106,.4);color:var(--amber);border-radius:999px;padding:7px 10px;font-size:8px;letter-spacing:.12em;font-weight:850;z-index:2}
.action-stack{display:grid;gap:10px;margin-top:16px}.btn{width:100%;min-height:56px;border-radius:18px;border:1px solid transparent;background:var(--red);color:white;font-weight:800;padding:14px 18px;box-shadow:0 14px 30px rgba(255,77,109,.16)}.btn.secondary{background:#211a28;border-color:var(--line);box-shadow:none}.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:#c3b9c4}.btn.small{min-height:46px;border-radius:15px;font-size:13px}.btn.row{display:flex;justify-content:space-between;align-items:center;text-align:left}.btn.row span:last-child{color:var(--muted)}
.empty{border:1px dashed rgba(255,248,236,.16);border-radius:24px;padding:34px 22px;text-align:center;color:var(--muted)}
.form{display:grid;gap:18px;margin-top:24px}.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9f95a2;margin:0 0 8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#19141f;border-radius:18px;padding:16px;outline:none;font-size:17px}.field textarea{min-height:112px;resize:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,77,109,.65);box-shadow:0 0 0 3px rgba(255,77,109,.08)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:20px;padding:15px 16px;background:#18131e}.toggle-row strong{display:block}.toggle-row small{display:block;color:var(--muted);margin-top:4px;line-height:1.3}.switch{width:52px;height:30px;border:0;border-radius:999px;background:#39303e;padding:3px;flex:0 0 auto}.switch::after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--red)}.switch.on::after{transform:translateX(22px)}
.counter{font-family:Georgia,"Times New Roman",serif;font-size:54px;line-height:1}.counter small{font-family:inherit;font-size:18px;color:var(--muted)}
.idea-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.idea{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(145deg,#211827,#17131d);text-align:left;min-height:150px}.idea .idea-tag{font-size:10px;letter-spacing:.15em;color:var(--red2);font-weight:850;text-transform:uppercase}.idea strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;line-height:1.05;margin-top:30px}.idea small{display:block;color:var(--muted);margin-top:8px;line-height:1.3}
.setting-card{border-top:1px solid var(--line);padding:18px 0}.setting-card:first-child{border-top:0}.setting-card h3{margin:0;font-size:16px}.setting-card p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.4}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--red2)}
.modal-wrap{position:fixed;z-index:3000;inset:0;background:rgba(6,4,9,.74);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.modal{width:min(100%,680px);background:#1c1622;border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal h2{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:400;margin:0}.modal p{color:var(--muted);line-height:1.45}.modal-actions{display:grid;gap:10px;margin-top:20px}
.scratch-page{min-height:100%;display:flex;flex-direction:column;justify-content:center}.scratch-head{text-align:center;margin-bottom:24px}.scratch-head h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:400;margin:8px 0}.scratch-wrap{position:relative;border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}.scratch-wrap .ticket{border-radius:30px;min-height:330px}.scratch-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:5}.scratch-progress{height:3px;background:#2d2532;border-radius:99px;overflow:hidden;margin:20px 14px 0}.scratch-progress i{display:block;height:100%;background:var(--red);width:0;box-shadow:0 0 14px var(--red)}.scratch-hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.toast{position:fixed;z-index:4000;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#fff8ec;color:#17121d;padding:11px 15px;border-radius:999px;font-weight:750;font-size:13px;box-shadow:0 12px 35px rgba(0,0,0,.3);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{border:1px solid var(--line);border-radius:18px;padding:14px;background:#17121d}.stat b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
@media(min-width:600px){.screen{padding-left:32px;padding-right:32px}.ticket-list{grid-template-columns:repeat(2,1fr)}.ticket-list .ticket:first-child:nth-last-child(1){grid-column:1/-1}.idea-grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body><div id="app"></div><div id="overlay"></div>
<script>
const STORAGE='couple-v2-electric';
const MONTHS=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
const COLORS=['red','violet','amber','mint'];
const IDEAS=[
 ['Une soirée cinéma','Tu choisis le film, je m’occupe du reste.','Maison'],['Un dîner improvisé','Rien que nous deux, sans programme.','Romantique'],['Petit-déjeuner au lit','Tu ne t’occupes de rien ce matin.','Attention'],['Une escapade surprise','Je prépare tout, tu viens avec moi.','Aventure'],['Une heure rien que pour toi','Je m’occupe du reste, profite simplement.','Attention'],['Un verre ailleurs','On change de décor juste pour ce soir.','Sortie'],['Une nuit sans téléphone','On coupe tout, sauf nous.','Nous'],['Ton dessert préféré','Je m’occupe de la surprise.','Gourmand'],['Une balade au hasard','On part sans itinéraire et on voit où ça mène.','Aventure'],['Un massage maison','Une vraie pause, rien que pour toi.','Attention'],['Une table surprise','Je réserve, tu découvres.','Sortie'],['Une matinée lente','Pas d’alarme, pas de programme.','Maison']
];
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const iso=d=>new Date(d).toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*86400000);
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
function monthStamp(date){const d=new Date(date);return `${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`}
function momentLabel(date){if(!date)return'';const d=new Date(date),today=new Date();const opts={weekday:'long',day:'numeric',month:'long'};let day=d.toLocaleDateString('fr-FR',opts);day=day.charAt(0).toUpperCase()+day.slice(1);return `${day} · ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`}
function baseState(){return{view:'home',filter:'available',perspective:'recipient',demo:false,draft:null,records:[],forcedUses:{},version:2}}
function load(){try{return {...baseState(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{return baseState()}}
let state=load();
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function normalize(){let changed=false;for(const r of state.records){if(r.status==='validated'&&r.momentAt&&new Date(r.momentAt).getTime()<=now()){r.status='used';r.usedAt=r.momentAt;changed=true}if(r.status==='forced'&&r.momentAt&&new Date(r.momentAt).getTime()<=now()){r.status='used';r.usedAt=r.momentAt;changed=true}}if(changed)save()}
function nav(){return `<nav class="bottom-nav" aria-label="Navigation principale">${navItem('home','Accueil',homeIcon())}${navItem('carnet','Carnet',bookIcon())}${navItem('ideas','Idées',diamondIcon())}${navItem('settings','Réglages',circleIcon())}</nav>`}
function navItem(v,l,icon){return `<button class="nav-item ${state.view===v?'active':''}" data-go="${v}">${icon}<span>${l}</span><i class="nav-dot"></i></button>`}
function homeIcon(){return '<svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg>'}function bookIcon(){return '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v16"/></svg>'}function diamondIcon(){return '<svg viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z"/></svg>'}function circleIcon(){return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>'}
function topbar(back=false,label='COUPLE'){return `<div class="topbar">${back?`<button class="icon-btn" data-back aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>`:`<div class="brand">COUPLE<i>.</i></div>`}<div class="brand">${back?esc(label):''}</div>${back?'<span style="width:44px"></span>':'<span class="pill">V2</span>'}</div>`}
function ticket(r,{compact=false}={}){const cls=`ticket ${r.color||'red'} ${compact?'compact':''} ${r.status==='used'?'used':''} ${r.momentMode==='giver'?'locked':''}`;let moment='';if(r.status==='proposal')moment=`Proposé · ${momentLabel(r.momentAt)}`;else if(r.status==='validated'||r.status==='forced')moment=momentLabel(r.momentAt);else if(r.status==='used'&&r.usedAt)moment=`Vécu · ${momentLabel(r.usedAt)}`;return `<article class="${cls}"><div class="ticket-month">${monthStamp(r.offeredAt||now())}</div><div class="ticket-kicker">BON POUR</div><h2 class="ticket-title">${esc(r.title)}</h2>${r.message?`<p class="ticket-message">${esc(r.message)}</p>`:''}${moment?`<div class="ticket-moment">${esc(moment)}</div>`:''}${r.status==='offered'?'<div class="ticket-status">À gratter</div>':''}</article>`}
function frame(content,{immersive=false}={}){return `<div class="app-frame ${immersive?'immersive':''}"><main class="scroll-stage"><section class="screen">${content}</section></main>${immersive?'':nav()}</div>`}
function home(){normalize();const pending=state.records.find(r=>r.direction==='received'&&r.status==='offered');const proposals=state.records.filter(r=>r.direction==='sent'&&r.status==='proposal');const next=state.records.filter(r=>['validated','forced'].includes(r.status)&&r.momentAt).sort((a,b)=>new Date(a.momentAt)-new Date(b.momentAt))[0];return frame(`${topbar()}<div class="hero"><p class="eyebrow">Rien que nous deux</p><h1 class="display">Des attentions<br><em>qui restent.</em></h1><p class="lead">Créer un bon, l’envoyer, le gratter. Le reste s’efface.</p><div class="hero-orb"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div></div>${pending?`<div class="notice"><strong>Un bon t’attend.</strong><span>Il ne manque plus qu’un geste pour le découvrir.</span><div class="action-stack"><button class="btn" data-scratch="${pending.id}">Gratter le bon</button></div></div>`:''}${proposals.length?`<div class="notice"><strong>${proposals.length} moment${proposals.length>1?'s':''} à valider</strong><span>Ton partenaire a proposé un moment pour ${proposals.length>1?'des bons que tu as offerts':'un bon que tu as offert'}.</span><div class="action-stack"><button class="btn secondary" data-go="carnet" data-filter="offered">Voir</button></div></div>`:''}${next?`<div class="section"><div class="section-head"><h2 class="section-title">À venir</h2></div>${ticket(next,{compact:true})}</div>`:''}<div class="section"><div class="section-head"><h2 class="section-title">Envie d’offrir ?</h2></div><div class="quick-grid"><button class="quick primary" data-go="ideas"><strong>Préparer<br>un bon</strong><small>Choisir une idée ou partir de zéro.</small><span class="plus">+</span></button><button class="quick" data-go="carnet"><strong>Notre<br>carnet</strong><small>Retrouver les moments.</small></button></div></div>`)}
function carnetRecords(filter){if(filter==='available')return state.records.filter(r=>r.direction==='received'&&['revealed','proposal','validated','forced','rejected'].includes(r.status));if(filter==='used')return state.records.filter(r=>r.status==='used');return state.records.filter(r=>r.direction==='sent'&&r.status!=='used')}
function carnet(){normalize();const list=carnetRecords(state.filter).sort((a,b)=>new Date(b.offeredAt)-new Date(a.offeredAt));return frame(`${topbar()}<p class="eyebrow">Collection</p><h1 class="display" style="font-size:56px">Notre carnet</h1><div class="segment"><button class="seg ${state.filter==='available'?'active':''}" data-filter="available">Disponibles</button><button class="seg ${state.filter==='used'?'active':''}" data-filter="used">Utilisés</button><button class="seg ${state.filter==='offered'?'active':''}" data-filter="offered">Offerts</button></div>${state.demo?demoStats():''}<div class="ticket-list">${list.length?list.map((r,i)=>`${ticket(r,{compact:i>0})}${i===0?recordActions(r):''}`).join(''):`<div class="empty">Aucun bon ici pour le moment.</div>`}</div>`)}
function demoStats(){const rec=state.records;return `<div class="stats"><div class="stat"><b>${rec.length}</b><span>bons</span></div><div class="stat"><b>${rec.filter(r=>r.status==='used').length}</b><span>vécus</span></div><div class="stat"><b>${rec.filter(r=>['validated','forced'].includes(r.status)).length}</b><span>prévus</span></div></div>`}
function recordActions(r){if(r.direction==='received'){
 if(r.momentMode==='giver')return `<div class="notice"><strong>Moment choisi par ton partenaire</strong><span>Ce bon fait partie de ses deux moments imposés de l’année. Le moment ne peut pas être modifié.</span></div>`;
 if(r.status==='proposal')return `<div class="notice"><strong>En attente de validation</strong><span>Ton partenaire doit accepter ce moment avant qu’il soit confirmé.</span></div><div class="action-stack"><button class="btn secondary" data-plan="${r.id}">Modifier le moment</button></div>`;
 if(r.status==='rejected')return `<div class="notice"><strong>Ce moment n’était pas possible.</strong><span>Choisis simplement un autre moment.</span></div><div class="action-stack"><button class="btn" data-plan="${r.id}">Proposer un autre moment</button></div>`;
 if(r.status==='validated')return `<div class="action-stack"><button class="btn secondary" data-plan="${r.id}">Modifier le moment</button></div>`;
 if(r.status==='revealed')return `<div class="action-stack"><button class="btn" data-plan="${r.id}">Choisir le moment</button></div>`;
 } else if(r.direction==='sent'&&r.status==='proposal') return `<div class="action-stack"><button class="btn" data-accept="${r.id}">Accepter ce moment</button><button class="btn secondary" data-reject="${r.id}">Refuser</button></div>`;
 return ''}
function ideas(){return frame(`${topbar()}<p class="eyebrow">Nouveau bon</p><h1 class="display" style="font-size:56px">Choisir une<br><em>attention.</em></h1><div class="action-stack" style="margin:24px 0"><button class="btn secondary row" data-custom><span>Créer le mien</span><span>→</span></button></div><div class="idea-grid">${IDEAS.map((x,i)=>`<button class="idea" data-idea="${i}"><span class="idea-tag">${esc(x[2])}</span><strong>${esc(x[0])}</strong><small>${esc(x[1])}</small></button>`).join('')}</div>`)}
function forcedRemaining(){const y=new Date().getFullYear();return Math.max(0,2-state.records.filter(r=>r.direction==='sent'&&r.momentMode==='giver'&&new Date(r.offeredAt).getFullYear()===y).length)}
function edit(){const d=state.draft||{title:'',message:'',force:false,momentAt:''};const preview={...d,offeredAt:now(),color:'red',status:'revealed',momentMode:d.force?'giver':'recipient'};return frame(`${topbar(true,'NOUVEAU BON')}<p class="eyebrow">Aperçu</p>${ticket(preview)}<div class="form"><div class="field"><label>Titre</label><input id="draft-title" value="${esc(d.title)}" placeholder="Un dîner improvisé"></div><div class="field"><label>Petit mot <span style="color:#655c69">· facultatif</span></label><textarea id="draft-message" placeholder="Quelques mots suffisent…">${esc(d.message)}</textarea></div><div class="toggle-row"><div><strong>Choisir exceptionnellement le moment</strong><small>${forcedRemaining()} possibilité${forcedRemaining()>1?'s':''} restante${forcedRemaining()>1?'s':''} cette année.</small></div><button class="switch ${d.force?'on':''}" data-force ${forcedRemaining()===0&&!d.force?'disabled':''}></button></div>${d.force?`<div class="field"><label>Moment imposé</label><input id="draft-moment" type="datetime-local" value="${esc(d.momentAt||'')}"></div>`:''}<button class="btn" data-send>Envoyer le bon</button></div>`,{immersive:true})}
function settings(){return frame(`${topbar()}<p class="eyebrow">Réglages</p><h1 class="display" style="font-size:56px">Couple.</h1><div class="section"><div class="setting-card"><h3>Mode démo · 6 mois</h3><p>Remplit le carnet avec 42 bons et des états variés pour éprouver l’interface dans des conditions réalistes.</p><div class="action-stack"><button class="btn secondary" data-demo>${state.demo?'Quitter le mode démo':'Activer le mode démo'}</button></div></div><div class="setting-card"><h3>Perspective de test</h3><p>Simule l’autre téléphone pour valider ou refuser les propositions de moment.</p><div class="action-stack"><button class="btn secondary" data-perspective>${state.perspective==='recipient'?'Passer côté donneur':'Passer côté destinataire'}</button></div></div><div class="setting-card"><h3>Données locales</h3><p>Cette V2 reste un prototype local. Aucune donnée n’est synchronisée entre deux appareils.</p><div class="action-stack"><button class="btn ghost" data-reset>Réinitialiser le prototype</button></div></div><div class="setting-card"><h3>Version</h3><p>Nuit électrique · V2</p></div></div>`)}
function scratch(id){const r=state.records.find(x=>x.id===id);if(!r)return home();return frame(`${topbar(true,'À GRATTER')}<div class="scratch-page"><div class="scratch-head"><p class="eyebrow">Une attention pour toi</p><h1>À toi de jouer.</h1><p class="lead" style="font-size:15px;margin:0 auto">Gratte directement le bon pour le révéler.</p></div><div class="scratch-wrap" data-scratch-wrap>${ticket(r)}<canvas class="scratch-canvas" data-canvas data-id="${r.id}"></canvas></div><div class="scratch-progress"><i data-progress></i></div><div class="scratch-hint">Gratte avec le doigt</div></div>`,{immersive:true})}
function render(){normalize();let out;if(state.view==='home')out=home();else if(state.view==='carnet')out=carnet();else if(state.view==='ideas')out=ideas();else if(state.view==='edit')out=edit();else if(state.view==='settings')out=settings();else if(state.view.startsWith('scratch:'))out=scratch(state.view.split(':')[1]);else out=home();document.querySelector('#app').innerHTML=out;bind();if(state.view.startsWith('scratch:'))requestAnimationFrame(initScratch)}
function go(v){state.view=v;save();render()}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function modal(title,text,actions){document.querySelector('#overlay').innerHTML=`<div class="modal-wrap"><div class="modal"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="modal-actions">${actions.map(a=>`<button class="btn ${a.secondary?'secondary':''}" data-modal="${a.key}">${esc(a.label)}</button>`).join('')}</div></div></div>`;document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{const key=b.dataset.modal;document.querySelector('#overlay').innerHTML='';const a=actions.find(x=>x.key===key);a&&a.fn()})}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.filter)state.filter=b.dataset.filter;go(b.dataset.go)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;save();render()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(state.view==='edit')go('ideas');else go('home')});document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{const x=IDEAS[+b.dataset.idea];state.draft={title:x[0],message:x[1],force:false,momentAt:''};go('edit')});document.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{state.draft={title:'',message:'',force:false,momentAt:''};go('edit')});document.querySelectorAll('[data-force]').forEach(b=>b.onclick=()=>{syncDraft();state.draft.force=!state.draft.force;save();render()});document.querySelectorAll('[data-send]').forEach(b=>b.onclick=sendDraft);document.querySelectorAll('[data-scratch]').forEach(b=>b.onclick=()=>go('scratch:'+b.dataset.scratch));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>planModal(b.dataset.plan));document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>accept(b.dataset.accept));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>reject(b.dataset.reject));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=toggleDemo);document.querySelectorAll('[data-perspective]').forEach(b=>b.onclick=togglePerspective);document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=resetAll)}
function syncDraft(){if(!state.draft)return;const t=document.querySelector('#draft-title'),m=document.querySelector('#draft-message'),d=document.querySelector('#draft-moment');if(t)state.draft.title=t.value.trim();if(m)state.draft.message=m.value.trim();if(d)state.draft.momentAt=d.value}
function sendDraft(){syncDraft();const d=state.draft;if(!d.title){toast('Ajoute un titre');return}if(d.force&&!d.momentAt){toast('Choisis le moment');return}const r={id:uid(),title:d.title,message:d.message,offeredAt:iso(now()),direction:'sent',status:d.force?'forced':'offered',momentMode:d.force?'giver':'recipient',momentAt:d.force?new Date(d.momentAt).toISOString():null,color:COLORS[state.records.length%COLORS.length]};state.records.push(r);state.draft=null;save();modal('Bon envoyé.','Il est maintenant prêt à être gratté sur l’autre téléphone.',[{key:'ok',label:'Retour à l’accueil',fn:()=>go('home')}])}
function planModal(id){const r=state.records.find(x=>x.id===id);if(!r||r.momentMode==='giver')return;const dt=new Date(Date.now()+3*86400000);dt.setHours(20,0,0,0);const local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);document.querySelector('#overlay').innerHTML=`<div class="modal-wrap"><div class="modal"><h2>Choisir le moment</h2><p>Ton partenaire devra accepter ce moment. Toute modification demandera une nouvelle validation.</p><div class="field"><label>Date et heure</label><input id="plan-date" type="datetime-local" value="${local}"></div><div class="modal-actions"><button class="btn" id="plan-save">Proposer ce moment</button><button class="btn secondary" id="plan-cancel">Annuler</button></div></div></div>`;document.querySelector('#plan-cancel').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#plan-save').onclick=()=>{const v=document.querySelector('#plan-date').value;if(!v)return;r.momentAt=new Date(v).toISOString();r.status='proposal';r.proposedAt=iso(now());delete r.validatedAt;save();document.querySelector('#overlay').innerHTML='';render();toast('Proposition envoyée')}}
function accept(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.status='validated';r.validatedAt=iso(now());save();render();toast('Moment validé')}
function reject(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.status='rejected';r.momentAt=null;r.rejectedAt=iso(now());save();render();toast('Proposition refusée')}
function togglePerspective(){state.perspective=state.perspective==='recipient'?'giver':'recipient';for(const r of state.records)r.direction=r.direction==='received'?'sent':'received';save();render();toast(state.perspective==='recipient'?'Vue destinataire':'Vue donneur')}
function resetAll(){modal('Réinitialiser ?','Tous les bons locaux de ce prototype seront supprimés.',[{key:'yes',label:'Réinitialiser',fn:()=>{state=baseState();save();render()}},{key:'no',label:'Annuler',secondary:true,fn:()=>{}}])}
function toggleDemo(){if(state.demo){const backup=state.demoBackup||baseState();state={...baseState(),...backup,view:'settings',demo:false};save();render();toast('Données personnelles restaurées');return}const backup=JSON.parse(JSON.stringify({...state,demo:false}));state=demoState();state.demoBackup=backup;save();render();toast('Mode démo activé')}
function demoState(){const s=baseState();s.demo=true;const titles=IDEAS.concat([['Un dimanche ailleurs','Une journée sans horaires.','Aventure'],['Ton plat préféré','Ce soir, je cuisine.','Gourmand'],['Une expo à deux','On choisit sur place.','Sortie'],['Une soirée jeux','Le perdant prépare le dessert.','Maison'],['Un réveil sans alarme','On laisse la matinée venir.','Maison'],['Une surprise après le travail','Sois prêt(e), je m’occupe du reste.','Surprise']]);const today=new Date();for(let i=0;i<42;i++){const x=titles[i%titles.length],off=addDays(addMonths(today,-(i%7)),-(i*3)%24);let direction=i%3===0?'sent':'received',status='used',momentAt=null,momentMode='recipient',usedAt=null;if(i<3){status=i===0?'revealed':i===1?'proposal':'validated';momentAt=i===0?null:iso(addDays(today,i+2))}else if(i===3){status='offered';direction='received'}else if(i===4){status='rejected';direction='received'}else if(i===5){status='forced';direction='received';momentMode='giver';momentAt=iso(addDays(today,8))}else if(i===6){status='proposal';direction='sent';momentAt=iso(addDays(today,4))}else{usedAt=iso(addDays(off,8+(i%10)));momentAt=usedAt}const r={id:'demo-'+i,title:x[0],message:i%5===0?'':x[1],offeredAt:iso(off),direction,status,momentMode,momentAt,usedAt,color:COLORS[i%COLORS.length]};s.records.push(r)}return s}
function initScratch(){const c=document.querySelector('[data-canvas]');if(!c)return;const wrap=c.parentElement,rect=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const g=ctx.createLinearGradient(0,0,rect.width,rect.height);g.addColorStop(0,'#d6c5aa');g.addColorStop(.45,'#9f8d79');g.addColorStop(1,'#6f6272');ctx.fillStyle=g;ctx.fillRect(0,0,rect.width,rect.height);ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='800 12px -apple-system';ctx.textAlign='center';ctx.letterSpacing='3px';ctx.fillText('GRATTE ICI',rect.width/2,rect.height/2);ctx.globalCompositeOperation='destination-out';let drawing=false,last=null,done=false;function p(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function scratchAt(pt){ctx.beginPath();ctx.arc(pt.x,pt.y,28,0,Math.PI*2);ctx.fill();if(last){ctx.lineWidth=56;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(pt.x,pt.y);ctx.stroke()}last=pt}function check(){if(done)return;const img=ctx.getImageData(0,0,c.width,c.height).data;let clear=0,total=0;for(let i=3;i<img.length;i+=4*32){total++;if(img[i]<30)clear++}const ratio=clear/Math.max(1,total);const bar=document.querySelector('[data-progress]');if(bar)bar.style.width=Math.min(100,ratio*150)+'%';if(ratio>.62){done=true;c.style.pointerEvents='none';c.animate([{opacity:1},{opacity:0}],{duration:450,fill:'forwards'});setTimeout(()=>finishScratch(c.dataset.id),420)}}c.addEventListener('pointerdown',e=>{drawing=true;last=null;c.setPointerCapture(e.pointerId);scratchAt(p(e))});c.addEventListener('pointermove',e=>{if(drawing){scratchAt(p(e));e.preventDefault()}});c.addEventListener('pointerup',()=>{drawing=false;last=null;check()});c.addEventListener('pointercancel',()=>{drawing=false;last=null})}
function finishScratch(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.status=r.momentMode==='giver'?'forced':'revealed';r.revealedAt=iso(now());state.filter='available';save();setTimeout(()=>{state.view='carnet';save();render();toast('Ajouté au carnet')},650)}
function installGuards(){const multi=e=>{if(e.touches&&e.touches.length>1)e.preventDefault()};document.addEventListener('touchstart',multi,{passive:false});document.addEventListener('touchmove',multi,{passive:false});['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>e.preventDefault(),{passive:false}));document.addEventListener('visibilitychange',()=>{if(!document.hidden){normalize();render()}});setInterval(()=>{const before=state.records.filter(r=>r.status==='used').length;normalize();const after=state.records.filter(r=>r.status==='used').length;if(after!==before)render()},60000)}
installGuards();render();
</script></body></html>
