<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F7F2E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Couple" />
  <title>Couple — Prototype web 0.7.1 · Accueil épuré</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23F7F2E8'/><path d='M32 45C27 41 15 33 15 23c0-6 4-10 10-10 3 0 6 2 7 4 2-2 4-4 8-4 5 0 9 4 9 10 0 10-12 18-17 22z' fill='none' stroke='%237B3239' stroke-width='3'/></svg>">
<style>

:root {
  --ivory:#F7F2E8;
  --paper:#FCF8F0;
  --paper2:#F2E8DA;
  --graphite:#34302D;
  --muted:#776F68;
  --line:#DCCDBE;
  --sand:#D8C5B0;
  --blush:#DFAEA4;
  --blush2:#F0D8D1;
  --burgundy:#7B3239;
  --burgundy2:#9B565B;
  --white:#FFF;
  --shadow:0 18px 46px rgba(60,43,34,.12);
  --shadow-soft:0 10px 26px rgba(60,43,34,.08);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ivory);color:var(--graphite)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overscroll-behavior-y:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
#app{min-height:100dvh}
.serif{font-family:Georgia,"Times New Roman",serif}

.shell{
  min-height:100dvh;
  padding-top:calc(var(--safe-top) + 6px);
  padding-bottom:calc(94px + var(--safe-bottom));
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.42),transparent 32%),
    linear-gradient(180deg,#F9F4EB 0%,var(--ivory) 60%,#F5EEE4 100%);
}
.shell.immersive{padding-bottom:calc(18px + var(--safe-bottom))}
.screen{
  width:min(100%,560px);
  min-height:calc(100dvh - var(--safe-top));
  margin:0 auto;
  padding:0 24px 42px;
  animation:screenIn .16s ease-out both
}
@keyframes screenIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.header{
  height:70px;
  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center
}
.brand{
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.34em;
  font-size:16px;
  white-space:nowrap
}
.icon-btn{
  border:0;background:transparent;color:var(--graphite);
  width:48px;height:48px;font-size:34px;line-height:1;text-align:left;padding:0
}
.icon-btn:disabled{opacity:0}
.icon-btn:active{opacity:.5}

.eyebrow{
  text-align:center;color:var(--burgundy);font-size:10px;letter-spacing:.24em;margin-top:18px
}
.hero{
  margin:16px 0 40px;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:clamp(41px,11vw,56px);
  line-height:1.06;
  text-align:center
}
.page-title{
  margin:20px 0 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,8.7vw,48px);
  line-height:1.08;font-weight:400
}
.page-copy{margin:14px 0 28px;color:var(--muted);font-size:16px;line-height:1.55}
.center-title{
  margin:14px 0 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px;line-height:1.12;text-align:center;font-weight:400
}
.center-copy{
  max-width:410px;margin:10px auto 0;text-align:center;color:var(--muted);line-height:1.55
}
.section-label{
  margin:29px 0 13px;color:var(--muted);font-size:10px;letter-spacing:.23em
}

.btn-stack{display:grid;gap:10px;margin-top:22px}
.btn{
  width:100%;min-height:54px;border-radius:28px;border:1px solid transparent;
  padding:0 22px;font-size:15px;font-weight:750;transition:transform .12s ease,opacity .12s ease
}
.btn:active{transform:scale(.99);opacity:.84}
.btn-primary{background:var(--burgundy);color:#fff;box-shadow:0 8px 18px rgba(123,50,57,.14)}
.btn-secondary{background:rgba(252,248,240,.92);color:var(--graphite);border-color:var(--line)}
.btn-quiet{background:transparent;color:var(--burgundy);border-color:var(--line)}
.btn-small{min-height:45px;font-size:13px}

.soft-card,.choice,.setting-card,.info-card{
  border:1px solid var(--line);background:rgba(252,248,240,.9);border-radius:26px
}
.soft-card{padding:22px}
.soft-title{font-family:Georgia,"Times New Roman",serif;font-size:23px}
.soft-copy{margin-top:9px;color:var(--muted);line-height:1.5}

.choice-list{display:grid;gap:10px}
.choice{
  width:100%;min-height:92px;padding:17px 19px;
  display:grid;grid-template-columns:44px 1fr 22px;gap:14px;align-items:center;
  text-align:left;color:inherit
}
.choice-icon{
  width:44px;height:44px;border-radius:50%;background:var(--blush2);
  display:grid;place-items:center;color:var(--burgundy);font-size:21px
}
.choice-title{font-weight:750;font-size:16px}
.choice-copy{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.35}
.chevron{color:var(--burgundy);font-size:29px}

/* Accueil évènement */
.event-hero{
  position:relative;
  margin:4px -4px 34px;
  padding:34px 22px 26px;
  border:1px solid rgba(123,50,57,.12);
  border-radius:34px;
  background:
    radial-gradient(circle at 50% 28%,rgba(255,255,255,.9),rgba(240,216,209,.40) 45%,rgba(247,242,232,.2) 74%),
    rgba(252,248,240,.75);
  box-shadow:var(--shadow-soft);
  overflow:hidden
}
.event-glow{
  position:absolute;width:220px;height:220px;border-radius:50%;left:50%;top:14px;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(223,174,164,.18),transparent 70%);
  animation:breathe 3.6s ease-in-out infinite
}
@keyframes breathe{0%,100%{transform:translateX(-50%) scale(.94);opacity:.64}50%{transform:translateX(-50%) scale(1.05);opacity:1}}
.event-title{
  position:relative;margin-top:18px;
  font-family:Georgia,"Times New Roman",serif;font-size:36px;text-align:center;font-weight:400
}
.event-copy{position:relative;margin:8px auto 0;max-width:330px;text-align:center;color:var(--muted);line-height:1.5}
.event-actions{position:relative;margin-top:22px}

/* Enveloppe premium */
.envelope-art{
  --scale:1;
  position:relative;
  width:min(88%,370px);
  aspect-ratio:1.56/1;
  margin:0 auto;
  transform:scale(var(--scale));
  perspective:900px
}
.env-shadow{
  position:absolute;left:9%;right:9%;bottom:-17px;height:28px;border-radius:50%;
  background:rgba(88,58,45,.12);filter:blur(13px)
}
.env-back{
  position:absolute;inset:12% 0 0;border:1px solid #D7C5B1;
  border-radius:24px;background:linear-gradient(180deg,#F5E9D9,#EEDDC8);
  box-shadow:var(--shadow)
}
.env-open-inside{
  position:absolute;left:2%;right:2%;top:12%;height:43%;
  border-radius:22px 22px 4px 4px;
  background:linear-gradient(180deg,#D9C2AB,#E9D8C5);
  opacity:.82
}
.env-paper{
  position:absolute;z-index:2;left:7%;right:7%;top:6%;height:64%;
  border:1px solid #E5D6C7;border-radius:16px;background:var(--paper);
  box-shadow:0 8px 20px rgba(74,52,40,.06)
}
.env-front{
  position:absolute;z-index:4;left:0;right:0;bottom:0;height:67%;
  border:1px solid #D7C5B1;border-radius:4px 4px 24px 24px;
  background:linear-gradient(160deg,#F6EADB 0%,#EFE0CD 75%);
  overflow:hidden
}
.env-front:before,.env-front:after{
  content:"";position:absolute;top:38%;width:68%;height:1px;background:#D8C5B2
}
.env-front:before{left:-20%;transform:rotate(31deg)}
.env-front:after{right:-20%;transform:rotate(-31deg)}
.env-address{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:.18em;
  color:#75695F
}
.env-address-line{
  position:absolute;left:34%;right:34%;top:49%;height:1px;background:#D4C0AD
}
.env-corner-mark{
  position:absolute;right:15px;bottom:12px;font-size:8px;letter-spacing:.2em;color:#9A8B80
}
.env-flap{
  position:absolute;z-index:5;left:0;right:0;top:12%;height:49%;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#FBF2E6,#F1E1CF);
  border-top:1px solid #D7C5B1;
  transform-origin:50% 0%;
  transition:transform .62s cubic-bezier(.2,.75,.2,1),filter .4s ease
}
.envelope-art.is-closed .env-flap{transform:translateY(0) rotate(0deg)}
.envelope-art.is-open .env-flap{
  transform:translateY(-76%) rotate(180deg);
  filter:brightness(.98);
  z-index:1
}
.env-seal{
  position:absolute;z-index:7;left:50%;top:49%;transform:translate(-50%,-50%);
  width:50px;height:50px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#EDC4BB,var(--blush));
  color:white;border:1px solid #E4BFB6;font-size:23px;
  box-shadow:0 7px 15px rgba(80,45,45,.11);
  transition:opacity .24s ease,transform .35s ease
}
.envelope-art.is-open .env-seal{
  opacity:0;transform:translate(-50%,-50%) scale(.72)
}
.env-mini{width:258px;margin:18px auto 24px}

/* Chèque Signature */
.cheque{
  position:relative;display:grid;grid-template-columns:66px 1px 1fr;
  width:100%;min-height:216px;background:var(--paper);
  border:1px solid #E3D4C5;border-radius:28px;box-shadow:var(--shadow);
  overflow:visible
}
.cheque.compact{min-height:174px}
.cheque-stub{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:13px 6px 10px;background:linear-gradient(180deg,rgba(240,216,209,.22),rgba(242,232,218,.20));
  border-radius:27px 0 0 27px
}
.stub-number{
  font-size:8px;letter-spacing:.13em;color:var(--muted);white-space:nowrap
}
.stub-category-glyph{
  margin-top:14px;width:31px;height:31px;border-radius:50%;
  display:grid;place-items:center;border:1px solid #D8C4B6;
  color:var(--burgundy);font-family:Georgia,"Times New Roman",serif;font-size:17px;
  background:rgba(252,248,240,.72)
}
.stub-category-code{
  margin-top:8px;font-size:8px;letter-spacing:.13em;color:var(--burgundy);font-weight:750
}
.stub-ledger-clip{
  position:absolute;left:5px;right:5px;bottom:10px;height:50px;overflow:hidden;display:grid;place-items:center
}
.stub-ledger{
  width:62px;transform:rotate(-90deg);text-align:center;
  font-size:8px;letter-spacing:.22em;color:#978A80
}
.perforation{margin:9px 0;border-left:1px dashed #BBA899}
.cheque-body{
  min-width:0;padding:18px 20px 16px;display:grid;justify-items:center;
  grid-template-rows:auto auto auto auto 1fr
}
.bon-pour{
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,5.7vw,28px);
  letter-spacing:.11em;color:var(--burgundy);margin-bottom:11px
}
.cheque-title{
  max-width:100%;font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:clamp(20px,5.5vw,26px);line-height:1.08;text-align:center;overflow-wrap:anywhere
}
.cheque-message{
  margin-top:8px;min-height:34px;font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-size:14px;line-height:1.35;color:var(--muted);text-align:center
}
.cheque-timing{
  width:100%;margin:9px 0 2px;padding-top:7px;border-top:1px solid rgba(220,205,190,.75);
  display:flex;align-items:baseline;justify-content:center;gap:7px;color:var(--muted)
}
.cheque-timing span{font-size:7px;letter-spacing:.16em}
.cheque-timing strong{
  font-family:Georgia,"Times New Roman",serif;font-size:13px;font-style:italic;
  font-weight:400;color:var(--burgundy)
}
.cheque-names{
  align-self:end;width:100%;display:flex;justify-content:space-between;gap:9px;
  color:var(--muted);font-size:9px;letter-spacing:.07em
}
.script{
  color:var(--graphite);font-family:Georgia,"Times New Roman",serif;font-size:16px;
  font-style:italic;letter-spacing:0
}
.cheque-seal{
  position:absolute;right:-17px;top:42%;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;background:var(--blush);color:white;font-size:22px;
  border:1px solid #E8C5BD
}
.used-stamp{
  position:absolute;right:38px;top:68px;width:84px;height:84px;border-radius:50%;
  border:2px solid rgba(123,50,57,.46);background:rgba(252,248,240,.82);
  color:var(--burgundy);display:grid;place-items:center;align-content:center;transform:rotate(-10deg)
}
.used-stamp b{font-size:10px;letter-spacing:.13em}
.used-stamp span{font-size:19px;margin-top:3px}

/* Bibliothèque */
.library-lead{margin-bottom:40px}
.category-block{margin-bottom:36px}
.category-title{
  margin:0 0 15px;font-family:Georgia,"Times New Roman",serif;
  font-size:25px;font-weight:400;color:var(--burgundy)
}
.idea-row{
  width:100%;min-height:82px;padding:15px 0;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:inherit;display:grid;grid-template-columns:1fr 22px;
  align-items:center;gap:12px;text-align:left
}
.idea-title{font-weight:750;font-size:15px}
.idea-copy{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.4}

/* Forms */
.form{display:grid;gap:16px;margin-top:27px}
.field{display:grid;gap:7px}
.field label{color:var(--muted);font-size:12px}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:18px;background:var(--paper);
  color:var(--graphite);padding:14px 16px;outline:none;font-size:16px
}
.field textarea{min-height:106px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Scène envoi */
.send-stage{
  position:relative;height:470px;margin-top:10px;overflow:hidden
}
.send-cheque-wrap{
  position:absolute;left:5%;right:5%;top:14px;z-index:4;
  transform-origin:center;
  animation:sendCheque 1.25s cubic-bezier(.25,.75,.18,1) forwards
}
.send-envelope{
  position:absolute;left:8%;right:8%;bottom:36px;z-index:3;
  animation:envRise .35s ease both
}
.send-envelope .env-flap{animation:sendCloseFlap .58s 1.02s cubic-bezier(.2,.75,.2,1) forwards}
.send-envelope .env-seal{opacity:0;animation:sealIn .3s 1.26s ease forwards}
.send-message{
  opacity:0;transform:translateY(8px);
  animation:messageIn .35s 1.55s ease forwards
}
@keyframes sendCheque{
  0%{transform:translateY(0) scale(.94);opacity:1}
  42%{transform:translateY(110px) scale(.88);opacity:1}
  82%{transform:translateY(230px) scale(.78);opacity:.96}
  100%{transform:translateY(282px) scale(.72);opacity:0}
}
@keyframes envRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sendCloseFlap{from{transform:translateY(-76%) rotate(180deg)}to{transform:translateY(0) rotate(0deg)}}
@keyframes sealIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes messageIn{to{opacity:1;transform:none}}

/* Réception */
.center-stage{
  min-height:calc(100dvh - 170px - var(--safe-top));
  display:grid;align-content:center;justify-items:center
}
.spark{
  width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:var(--blush2);color:var(--burgundy);font-size:37px
}

/* Révélation signature en chapitres */
.reveal-chapter{position:relative}
.chapter-index{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 18px;border:1px solid var(--line);color:var(--burgundy);
  font-family:Georgia,"Times New Roman",serif;font-size:12px;background:rgba(252,248,240,.72)
}
.clue-orb{
  width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  margin:0 auto 20px;background:radial-gradient(circle at 35% 28%,#F7E9E4,#E8BDB5);
  color:var(--burgundy);font-family:Georgia,"Times New Roman",serif;font-size:42px;
  box-shadow:0 15px 36px rgba(123,50,57,.10)
}
.clue-label{text-align:center;font-size:9px;letter-spacing:.24em;color:var(--muted)}
.clue-category{
  margin:10px 0 0;text-align:center;font-family:Georgia,"Times New Roman",serif;
  color:var(--burgundy);font-size:36px;font-weight:400
}
.clue-rule{width:46px;height:1px;background:var(--line);margin:22px auto 0}
.clue-secret{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 0}
.envelope-interaction{
  width:100%;border:0;background:transparent;padding:18px 0 8px;color:inherit;
  position:relative
}
.envelope-interaction .envelope-art{transition:transform .3s ease}
.envelope-interaction:active .envelope-art{transform:scale(.985)}
.env-ticket-edge{
  position:absolute;z-index:3;left:50%;top:33%;transform:translate(-50%,16px);
  width:58%;height:46px;border:1px solid #E3D4C5;border-radius:13px 13px 4px 4px;
  background:var(--paper);display:grid;place-items:center;
  font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.14em;color:var(--burgundy);
  opacity:0;transition:opacity .35s .25s ease,transform .45s .2s ease
}
.envelope-interaction.opened .env-ticket-edge,
.env-ticket-edge.visible{opacity:1;transform:translate(-50%,-10px)}
.envelope-open-cta{
  width:100%;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .35s ease,opacity .3s .15s ease,margin .35s ease
}
.envelope-open-cta.visible{max-height:90px;opacity:1;margin-top:14px}

.reveal-wrap{margin-top:2px}
.extract-stage{
  --p:0;
  position:relative;width:100%;height:430px;margin-top:20px;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden
}
.extract-stage.dragging{cursor:grabbing}
.extract-envelope{
  position:absolute;z-index:4;left:3%;right:3%;bottom:-12px;height:260px;
  pointer-events:none
}
.extract-envelope .envelope-art{width:100%}
.extract-ticket{
  position:absolute;z-index:3;left:8%;right:8%;bottom:78px;
  transform:translateY(calc(105px - (var(--p) * 350px))) scale(calc(.88 + var(--p)*.08));
  opacity:calc(.48 + var(--p)*.52);
  will-change:transform,opacity
}
.extract-grip{
  position:absolute;z-index:6;left:50%;bottom:136px;transform:translateX(-50%);
  width:56px;height:5px;border-radius:4px;background:rgba(123,50,57,.28);pointer-events:none
}
.extract-stage.settling .extract-ticket,
.extract-stage.settling .extract-envelope{pointer-events:none}
.reveal-arrow{
  position:absolute;z-index:7;left:50%;bottom:48px;transform:translateX(-50%);
  color:var(--burgundy);font-size:30px;pointer-events:none;
  animation:arrowFloat 1.5s ease-in-out infinite
}
@keyframes arrowFloat{0%,100%{transform:translate(-50%,3px);opacity:.55}50%{transform:translate(-50%,-5px);opacity:1}}
.reveal-instruction{text-align:center;margin-top:10px;font-weight:750;font-size:14px}
.reveal-detail{text-align:center;margin:6px auto 0;max-width:390px;color:var(--muted);font-size:12px;line-height:1.45}
.reveal-progress{
  --p:0;width:62%;height:3px;margin:14px auto 0;border-radius:4px;background:var(--paper2);overflow:hidden
}
.reveal-progress i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--burgundy)}
.reveal-threshold{
  width:7px;height:7px;border-radius:50%;background:var(--blush);margin:-5px auto 0;
  transform:translateX(13%);opacity:.75
}

/* Découverte */
.discovery-card{margin-top:28px}
.discovery-quiet{
  margin-top:18px;text-align:center;color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;font-style:italic
}

/* Carnet — pile verticale type Wallet */
.segmented{
  margin-top:18px;padding:4px;border-radius:28px;background:var(--paper2);
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px
}
.segment-btn{
  min-height:46px;border:0;background:transparent;border-radius:24px;color:var(--muted);font-size:13px
}
.segment-btn.active{background:var(--paper);color:var(--burgundy);font-weight:750;box-shadow:0 4px 12px rgba(70,45,35,.05)}
.album-shell{margin-top:24px;min-height:0}
.wallet-stack{display:flex;flex-direction:column;gap:9px}
.wallet-card{
  position:relative;transition:transform .22s ease,filter .22s ease;cursor:pointer
}
.wallet-card.collapsed{height:84px}
.wallet-card.collapsed .wallet-clip{
  height:84px;overflow:hidden;border-radius:27px;
  box-shadow:0 9px 20px rgba(60,43,34,.08)
}
.wallet-card.collapsed .cheque{
  transform:translateY(0) scale(.985);transform-origin:top center;
  box-shadow:none
}
.wallet-card.selected{
  margin:3px 0 5px;z-index:5
}
.wallet-card.selected .wallet-clip{overflow:visible;padding-right:18px}
.wallet-card:not(.selected):active{transform:translateY(-2px)}
.wallet-selected-meta{
  margin:11px 10px 0;text-align:center;color:var(--muted);font-size:11px;line-height:1.4
}
.wallet-actions{display:grid;gap:9px;margin-top:14px}
.wallet-hint{
  margin-top:12px;text-align:center;color:var(--muted);font-size:10px;min-height:14px
}
.album-note{
  margin:20px auto 0;max-width:420px;text-align:center;color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;font-size:15px;font-style:italic;line-height:1.45
}
.empty-state{
  padding:40px 24px;border-radius:28px;background:var(--paper2);text-align:center
}
.empty-book{
  width:118px;height:76px;margin:0 auto 20px;position:relative
}
.empty-book:before,.empty-book:after{
  content:"";position:absolute;top:8px;width:58px;height:64px;border:1px solid var(--line);background:var(--paper)
}
.empty-book:before{left:0;border-radius:16px 4px 4px 16px;transform:rotate(4deg)}
.empty-book:after{right:0;border-radius:4px 16px 16px 4px;transform:rotate(-4deg)}
.empty-title{font-family:Georgia,"Times New Roman",serif;font-size:22px}
.empty-copy{margin-top:8px;color:var(--muted);line-height:1.5}

/* Timing / activation */
.timing-list{display:grid;gap:11px;margin-top:28px}
.timing-choice{
  min-height:74px;width:100%;border:1px solid var(--line);border-radius:22px;
  background:var(--paper);padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;color:inherit
}
.timing-choice b{font-size:16px}
.timing-choice span{color:var(--burgundy);font-size:21px}
.confirm-orb{
  width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#F1D3CC,var(--blush));
  color:white;font-size:42px;box-shadow:0 14px 30px rgba(123,50,57,.16)
}

/* Expéditeur informé */
.sender-event{
  position:relative;margin-top:26px;padding:34px 22px;border:1px solid var(--line);border-radius:32px;
  background:linear-gradient(180deg,rgba(240,216,209,.42),rgba(252,248,240,.92));
  overflow:hidden
}
.sender-event:before{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;top:-70px;right:-50px;
  background:rgba(223,174,164,.16)
}
.sender-fragment{width:82%;margin:18px auto 0;transform:rotate(-2deg);opacity:.96}

/* Utilisation */
.use-stamp-scene{position:relative;margin-top:34px}
.use-stamp-scene .used-stamp{
  right:50%;top:48%;transform:translate(50%,-50%) rotate(-10deg) scale(0);
  animation:stampPop .46s .28s cubic-bezier(.2,.9,.25,1.25) forwards
}
@keyframes stampPop{to{transform:translate(50%,-50%) rotate(-10deg) scale(1)}}

/* Settings */
.settings-list{display:grid;gap:10px}
.setting-card{
  min-height:105px;padding:19px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:13px
}
.setting-title{font-weight:750}
.setting-copy{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.switch{width:59px;height:34px;border:0;border-radius:18px;background:var(--sand);padding:3px}
.switch:after{content:"";display:block;width:28px;height:28px;border-radius:50%;background:white;transition:transform .16s ease}
.switch.on{background:var(--blush)}
.switch.on:after{transform:translateX(25px)}
.info-card{padding:21px;margin-top:14px;background:var(--paper2);border:0}
.info-title{font-family:Georgia,"Times New Roman",serif;color:var(--burgundy);font-size:22px}
.info-copy{margin-top:8px;color:var(--muted);line-height:1.5}

/* Prototype simulation */
.proto-note{
  margin-top:12px;text-align:center;color:var(--muted);font-size:10px;line-height:1.4
}
.proto-chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:16px;
  background:var(--paper2);color:var(--muted);font-size:10px
}

/* Modal */
.modal-backdrop{
  position:fixed;z-index:70;inset:0;padding:24px;padding-bottom:calc(24px + var(--safe-bottom));
  background:rgba(52,48,45,.24);display:grid;align-items:end
}
.modal{
  width:min(100%,520px);margin:0 auto;border-radius:30px;background:var(--paper);
  padding:24px;box-shadow:0 22px 60px rgba(60,45,37,.22)
}
.modal-title{font-family:Georgia,"Times New Roman",serif;font-size:28px}
.modal-copy{margin-top:8px;color:var(--muted);line-height:1.5}

/* Navigation */
.bottom-nav{
  position:fixed;z-index:50;left:18px;right:18px;bottom:calc(10px + var(--safe-bottom));
  height:64px;max-width:530px;margin:0 auto;border:1px solid var(--line);border-radius:34px;
  background:rgba(252,248,240,.96);box-shadow:0 12px 34px rgba(60,45,37,.10);
  display:grid;grid-template-columns:repeat(4,1fr);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.nav-btn{
  border:0;background:transparent;color:var(--muted);
  display:grid;place-content:center;justify-items:center;gap:1px
}
.nav-btn b{font-size:18px;line-height:1.05;font-weight:500}
.nav-btn span{font-size:10px}
.nav-btn.active{color:var(--burgundy);font-weight:750}

@media(min-width:700px){
  .screen{padding-left:30px;padding-right:30px}
}

/* Patch final V0.5 */
.send-envelope .envelope-art{width:100%}
.send-envelope .env-address{opacity:.9}
.send-envelope .env-seal{opacity:0;animation:sealIn .3s 1.52s ease forwards}
.send-message{animation-delay:1.72s}
@media (prefers-reduced-motion: reduce){
  .screen,.event-glow,.reveal-arrow{animation:none!important}
  *{scroll-behavior:auto!important}
}

<body>
  <div id="app"></div>
  <script>

(() => {
  'use strict';

  const STORAGE_KEY = 'couple-web-prototype-v07';
  const PREVIOUS_STORAGE_KEY = 'couple-web-prototype-v06';

  const IDEAS = [
    {id:'rom-1',title:'Un dîner improvisé',category:'Romantique',message:'Rien que nous deux, sans programme.'},
    {id:'rom-2',title:'Un message aux heures chaudes',category:'Romantique',message:'Un moment à deux, juste pour se retrouver.'},
    {id:'out-1',title:'Une promenade sans destination',category:'Sorties',message:'On marche jusqu’à avoir envie de s’arrêter.'},
    {id:'out-2',title:'Une sortie choisie pour toi',category:'Sorties',message:'Je prépare l’endroit, tu n’as plus qu’à venir.'},
    {id:'adv-1',title:'Une escapade surprise',category:'Aventure',message:'Je prépare tout, tu viens avec moi.'},
    {id:'adv-2',title:'Une journée hors routine',category:'Aventure',message:'Un petit ailleurs, juste assez loin du quotidien.'},
    {id:'home-1',title:'Une soirée cinéma',category:'Maison',message:'Tu choisis le film, je m’occupe du reste.'},
    {id:'home-2',title:'Un petit déjeuner au lit',category:'Maison',message:'Un matin lent, rien qu’à nous.'},
    {id:'att-1',title:'Une heure rien que pour toi',category:'Petites attentions',message:'Je m’occupe du reste, profite simplement.'},
    {id:'att-2',title:'Ton dessert préféré',category:'Petites attentions',message:'Parce que les petits plaisirs comptent aussi.'},
    {id:'int-1',title:'Une soirée rien que pour nous',category:'Intime / Couple',message:'À utiliser quand le moment vous ressemble.'},
    {id:'int-2',title:'Un moment sans téléphone',category:'Intime / Couple',message:'Juste nous deux, sans interruption.'}
  ];

  const CATEGORIES = ['Romantique','Sorties','Aventure','Maison','Petites attentions','Intime / Couple'];

  const INITIAL_DRAFT = {
    title:'Un dîner improvisé',
    message:'Rien que nous deux, ici et maintenant.',
    to:'Toi',
    from:'Moi',
    category:'Romantique',
    validity:''
  };

  function freshState() {
    return {
      version:7,
      screen:'home',
      draft:{...INITIAL_DRAFT},
      records:[],
      currentRecordId:null,
      selectedRecordId:null,
      carnetFilter:'available',
      albumIndex:{available:0,used:0,offered:0},
      settings:{notifications:true,faceId:true},
      perspective:'recipient',
      envelopeOpened:false,
      plannerDate:'',
      plannerMoment:'evening',
      modal:null
    };
  }

  function migrateRecordV05(record) {
    if (!record || record.schedule || record.status !== 'scheduled') return record;
    const now=new Date();
    let moment='evening', label='Bientôt';
    if(record.timing==='now'){moment='now';label='Maintenant'}
    else if(record.timing==='tonight'){moment='evening';label='Ce soir'}
    return {...record,schedule:{type:'legacy',date:toLocalISO(now),moment,label,note:''}};
  }

  function loadState() {
    try {
      let raw=localStorage.getItem(STORAGE_KEY), migrated=false;
      if(!raw){raw=localStorage.getItem(PREVIOUS_STORAGE_KEY);migrated=!!raw}
      if(!raw) return freshState();
      const parsed=JSON.parse(raw);
      const next={...freshState(),...parsed,version:7,screen:'home',modal:null,envelopeOpened:false,
        records:(parsed.records||[]).map(migrateRecordV05),
        albumIndex:{...freshState().albumIndex,...(parsed.albumIndex||{})},
        settings:{...freshState().settings,...(parsed.settings||{})}};
      if(migrated) localStorage.setItem(STORAGE_KEY,JSON.stringify({...next,screen:'home',modal:null,envelopeOpened:false}));
      return next;
    } catch (_) { return freshState(); }
  }


  let state = loadState();

  function persist() {
    const snapshot = {...state,screen:'home',modal:null};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot));
  }

  function setState(patch,{save=true}={}) {
    state={...state,...patch};
    if(save) persist();
    render();
  }

  function escapeHtml(value='') {
    return String(value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function pad2(n){return String(n).padStart(2,'0')}
  function toLocalISO(date){return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`}
  function fromLocalISO(value){if(!value)return null;const [y,m,d]=value.split('-').map(Number);return y&&m&&d?new Date(y,m-1,d,12,0,0,0):null}
  function addDays(date,days){const d=new Date(date);d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return d}
  function nextSaturdayDate(){const now=new Date();let delta=(6-now.getDay()+7)%7;if(delta===0)delta=7;return addDays(now,delta)}
  function formatDateLong(value){const d=fromLocalISO(value);return d?new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d):''}
  function formatDateShort(value){const d=fromLocalISO(value);return d?new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}).format(d).replace('.',''):''}
  function momentLabel(moment){return ({now:'maintenant',morning:'le matin',noon:'à midi',afternoon:"dans l’après-midi",evening:'le soir'})[moment]||'dans la journée'}
  function scheduleLabel(rec){
    if(!rec)return'';const s=rec.schedule;
    if(!s){if(rec.timing==='now')return'Maintenant';if(rec.timing==='tonight')return'Ce soir';if(rec.timing==='soon')return'Bientôt';return''}
    if(s.type==='now')return'Maintenant';if(s.type==='tonight')return'Ce soir';if(s.label)return s.label;
    return `${formatDateShort(s.date)}${s.moment&&s.moment!=='now'?` · ${momentLabel(s.moment)}`:''}`;
  }
  function scheduleSentence(rec){
    if(!rec||!rec.schedule)return timingPhrase(rec?.timing,false);const s=rec.schedule;
    if(s.type==='now')return'maintenant';if(s.type==='tonight')return'ce soir';if(s.type==='tomorrow-evening')return'demain soir';
    if(s.type==='saturday')return `samedi${s.date?` ${formatDateShort(s.date)}`:''}`;
    if(s.type==='custom')return `${formatDateLong(s.date)}${s.moment?` ${momentLabel(s.moment)}`:''}`;
    return s.label?s.label.toLowerCase():'bientôt';
  }
  function scheduleRecord(rec,schedule){
    updateRecord(rec.id,{status:'scheduled',schedule,timing:schedule.type==='now'?'now':schedule.type==='tonight'?'tonight':'soon',scheduledAt:Date.now()});
    state.selectedRecordId=rec.id;state.currentRecordId=rec.id;persist();navigate('activation');
  }

  function makeId() {
    return `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  }

  function recordById(id) {
    return state.records.find(r=>r.id===id)||null;
  }

  function currentRecord() {
    return recordById(state.selectedRecordId)||recordById(state.currentRecordId)||null;
  }

  function updateRecord(id,patch) {
    state.records=state.records.map(r=>r.id===id?{...r,...patch}:r);
    persist();
  }

  function navigate(screen,patch={}) {
    state={...state,...patch,screen,modal:null};
    persist();
    try { window.scrollTo({top:0,behavior:'instant'}); } catch (_) { window.scrollTo(0,0); }
    render();
  }

  function header(title='COUPLE',back=null) {
    return `
      <div class="header">
        <button class="icon-btn" data-back="${back||''}" ${back?'':'disabled'}>${back?'‹':''}</button>
        <div class="brand">${escapeHtml(title)}</div>
        <div></div>
      </div>`;
  }

  function nav() {
    const active =
      ['carnet','discovered','usedScene','activation','timing','planSoon','planner'].includes(state.screen) ? 'carnet'
      : ['library','ideas'].includes(state.screen) ? 'ideas'
      : state.screen==='settings' ? 'settings'
      : 'home';

    const items=[
      ['home','⌂','Accueil'],
      ['carnet','▤','Carnet'],
      ['ideas','◇','Idées'],
      ['settings','○','Réglages']
    ];

    return `<nav class="bottom-nav">
      ${items.map(([key,glyph,label])=>`
        <button class="nav-btn ${active===key?'active':''}" data-nav="${key}">
          <b>${glyph}</b><span>${label}</span>
        </button>`).join('')}
    </nav>`;
  }

  function page(inner,{title='COUPLE',back=null,immersive=false}={}) {
    return `
      <main class="shell ${immersive?'immersive':''}">
        <section class="screen">
          ${header(title,back)}
          ${inner}
        </section>
        ${immersive?'':nav()}
      </main>`;
  }

  function btn(label,action,kind='primary',extra='') {
    const cls=kind==='secondary'?'btn-secondary':kind==='quiet'?'btn-quiet':'btn-primary';
    return `<button class="btn ${cls} ${extra}" data-action="${action}">${escapeHtml(label)}</button>`;
  }

  function categoryCode(category='') {
    const map={
      'Romantique':'ROM',
      'Sorties':'SORT',
      'Aventure':'AV',
      'Maison':'MAI',
      'Petites attentions':'ATT',
      'Intime / Couple':'NOUS'
    };
    return map[category]||'PERS';
  }

  function categoryGlyph(category='') {
    const map={
      'Romantique':'♡',
      'Sorties':'↗',
      'Aventure':'✦',
      'Maison':'⌂',
      'Petites attentions':'·',
      'Intime / Couple':'∞'
    };
    return map[category]||'◇';
  }

  function action(raw) {
    const first=raw.indexOf(':');
    const name=first>=0?raw.slice(0,first):raw;
    const arg=first>=0?raw.slice(first+1):'';

    if(['home','prepare','library','ideas','surprise','custom','edit','ready','carnet','settings'].includes(name)){
      navigate(name);return;
    }

    if(name==='random'){
      const idea=IDEAS[Math.floor(Math.random()*IDEAS.length)];
      state.draft={...state.draft,title:idea.title,message:idea.message,category:idea.category};
      persist();navigate('edit');return;
    }

    if(name==='custom-start'){
      state.draft={title:'',message:'',to:'Toi',from:'Moi',category:'',validity:''};
      persist();navigate('edit');return;
    }

    if(name==='send'){
      state.perspective='sender';
      persist();
      navigate('sendScene');
      return;
    }

    if(name==='scratch-send-done'){
      const rec={
        id:makeId(),
        cheque:{...state.draft,serial:state.records.length+1},
        status:'offered',
        createdAt:Date.now(),
        timing:null,
        scheduledAt:null,
        revealedAt:null,
        usedAt:null
      };
      state.records=[rec,...state.records];
      state.currentRecordId=rec.id;
      state.selectedRecordId=rec.id;
      state.perspective='sender';
      persist();
      navigate('sendComplete');
      return;
    }

    if(name==='scratch-finish'){
      const rec=currentRecord();
      if(rec && rec.status==='offered'){
        updateRecord(rec.id,{status:'revealed',revealedAt:Date.now()});
      }
      navigate('discovered');
      return;
    }

    if(name==='switch-recipient'){
      state.perspective='recipient';
      state.currentRecordId=arg;
      state.selectedRecordId=arg;
      state.envelopeOpened=false;
      persist();
      navigate('receiveIntro');
      return;
    }

    if(name==='receive-intro'){
      state.currentRecordId=arg;
      state.selectedRecordId=arg;
      state.envelopeOpened=false;
      persist();
      navigate('receiveIntro');
      return;
    }

    if(name==='show-clue'){
      navigate('clue');return;
    }

    if(name==='to-envelope'){
      state.envelopeOpened=false;
      persist();
      navigate('openEnvelope');return;
    }

    if(name==='start-extract'){
      navigate('extract');return;
    }

    if(name==='keep'){
      updateRecord(arg,{status:'revealed'});
      state.selectedRecordId=arg;
      state.carnetFilter='available';
      persist();
      navigate('carnet');
      return;
    }

    if(name==='timing'){
      state.selectedRecordId=arg;
      persist();
      navigate('timing');
      return;
    }

    if(name==='use-now'){const rec=recordById(arg);if(!rec)return;state.selectedRecordId=arg;scheduleRecord(rec,{type:'now',date:toLocalISO(new Date()),moment:'now',label:'Maintenant',note:''});return;}
    if(name==='plan-soon'){state.selectedRecordId=arg;persist();navigate('planSoon');return;}
    if(name==='save-plan'){const rec=currentRecord(),dateEl=document.getElementById('planner-date'),momentEl=document.getElementById('planner-moment'),noteEl=document.getElementById('planner-note');if(!rec||!dateEl?.value)return;const date=dateEl.value,moment=momentEl?.value||'evening',note=String(noteEl?.value||'').trim();scheduleRecord(rec,{type:'custom',date,moment,label:`${formatDateShort(date)} · ${momentLabel(moment)}`,note});return;}

    if(name==='switch-sender'){
      state.perspective='sender';
      state.selectedRecordId=arg;
      persist();
      navigate('senderEvent');
      return;
    }

    if(name==='sender-event'){
      state.selectedRecordId=arg;
      persist();
      navigate('senderEvent');
      return;
    }

    if(name==='switch-back'){
      state.perspective='recipient';
      state.selectedRecordId=arg;
      state.carnetFilter='available';
      persist();
      navigate('carnet');
      return;
    }

    if(name==='confirm-use'){
      state.selectedRecordId=arg;
      state.modal={type:'use',id:arg};
      persist();render();return;
    }

    if(name==='do-use'){
      updateRecord(arg,{status:'used',usedAt:Date.now()});
      state.selectedRecordId=arg;
      state.modal=null;
      state.carnetFilter='used';
      persist();
      navigate('usedScene');
      return;
    }

    if(name==='details'){
      state.selectedRecordId=arg;
      state.modal={type:'details',id:arg};
      persist();render();return;
    }

    if(name==='close-modal'){
      setState({modal:null});return;
    }

    if(name==='toggle-perspective'){
      state.perspective=state.perspective==='recipient'?'sender':'recipient';
      persist();navigate('home');return;
    }

    if(name==='reset'){
      if(confirm('Réinitialiser tous les bons de test de ce navigateur ?')){
        localStorage.removeItem(STORAGE_KEY);
        state=freshState();
        render();
      }
    }
  }

  function setupScratchSend() {
    const cover=document.getElementById('scratch-send-cover');
    const coverBtn=document.getElementById('scratch-cover-btn');
    const sendBtn=document.getElementById('scratch-send-btn');
    const status=document.getElementById('scratch-send-status');
    if(!cover||!coverBtn||!sendBtn) return;

    let covered=false;

    coverBtn.addEventListener('click',()=>{
      if(covered) return;
      covered=true;
      cover.classList.add('covered');
      coverBtn.disabled=true;
      coverBtn.textContent='Bon masqué';
      if(status) status.textContent='La surprise se referme…';

      setTimeout(()=>{
        if(navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
        sendBtn.disabled=false;
        sendBtn.classList.add('ready');
        if(status) status.textContent='Le bon est prêt à partir.';
      },820);
    });
  }

  function setupScratchReveal() {
    const rec=currentRecord();
    const canvas=document.getElementById('scratch-canvas');
    const zone=document.getElementById('scratch-canvas-zone');
    const label=document.getElementById('scratch-canvas-label');
    const fill=document.getElementById('scratch-progress-fill');
    const progressCopy=document.getElementById('scratch-progress-copy');
    const pageCopy=document.getElementById('scratch-reveal-copy');
    const finish=document.getElementById('scratch-reveal-finish');
    if(!rec||!canvas||!zone) return;

    const dpr=Math.min(window.devicePixelRatio||1,2);
    let ctx=null,drawing=false,last=null,completed=false,thresholdBuzz=false,checkCounter=0;

    function sizeCanvas(){
      const rect=zone.getBoundingClientRect();
      canvas.width=Math.max(1,Math.round(rect.width*dpr));
      canvas.height=Math.max(1,Math.round(rect.height*dpr));
      canvas.style.width=rect.width+'px';
      canvas.style.height=rect.height+'px';

      ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.setTransform(dpr,0,0,dpr,0,0);

      const w=rect.width,h=rect.height;
      const g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,'#E9DDC9');
      g.addColorStop(.34,'#D6C09B');
      g.addColorStop(.64,'#E4D4B9');
      g.addColorStop(1,'#C9AC7D');
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle=g;
      ctx.fillRect(0,0,w,h);

      // Grain très fin : matière, pas confettis.
      ctx.globalAlpha=.14;
      for(let i=0;i<360;i++){
        const x=Math.random()*w,y=Math.random()*h,r=Math.random()*.75+.15;
        ctx.fillStyle=Math.random()>.5?'#FFF9EF':'#A98B67';
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;

      // Le masque doit être totalement opaque avant le premier grattage.
      // Aucun texte du bon n'est reproduit sur la matière.
      zone.style.background='transparent';
      zone.classList.add('scratch-ready');
    }

    function point(e){
      const r=canvas.getBoundingClientRect();
      return {x:e.clientX-r.left,y:e.clientY-r.top};
    }

    function scratch(a,b){
      if(!ctx)return;
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      ctx.lineCap='round';ctx.lineJoin='round';
      ctx.lineWidth=30;
      ctx.strokeStyle='#000';
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.beginPath();ctx.arc(b.x,b.y,16,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    function dust(e){
      if(Math.random()>.50)return;
      const dot=document.createElement('i');
      dot.className='scratch-dust';
      dot.style.left=(e.clientX+(Math.random()*8-4))+'px';
      dot.style.top=(e.clientY+(Math.random()*8-4))+'px';
      dot.style.setProperty('--dx',(Math.random()*18-9)+'px');
      dot.style.setProperty('--dy',(Math.random()*14+6)+'px');
      document.body.appendChild(dot);
      setTimeout(()=>dot.remove(),450);
    }

    function ratio(){
      if(!ctx)return 0;
      const w=canvas.width,h=canvas.height;
      const data=ctx.getImageData(0,0,w,h).data;
      const step=18;
      let clear=0,total=0;
      for(let y=0;y<h;y+=step){
        for(let x=0;x<w;x+=step){
          total++;
          if(data[(y*w+x)*4+3]<28)clear++;
        }
      }
      return total?clear/total:0;
    }

    function update(force=false){
      if(completed)return;
      checkCounter++;
      if(!force && checkCounter%3!==0)return;

      const r=ratio(),pct=Math.min(100,Math.round(r*100));
      if(fill)fill.style.width=pct+'%';
      if(r>.10)label?.classList.add('hidden');

      if(r<.28){
        if(progressCopy)progressCopy.textContent='Continue…';
      } else if(r<.52){
        if(progressCopy)progressCopy.textContent='Le bon commence à apparaître…';
        if(pageCopy)pageCopy.textContent='Le contenu se révèle progressivement sous ton doigt.';
      } else if(r<.70){
        if(progressCopy)progressCopy.textContent='Encore un peu…';
      } else {
        if(progressCopy)progressCopy.textContent='Presque découvert…';
      }

      if(r>=.68&&!thresholdBuzz){
        thresholdBuzz=true;
        if(navigator.vibrate){try{navigator.vibrate(10)}catch(_){}}
      }

      if(r>=.82){
        completed=true;
        if(navigator.vibrate){try{navigator.vibrate([10,22,16])}catch(_){}}

        // Nettoyage automatique du reste de la matière.
        canvas.style.transition='opacity .45s ease';
        canvas.style.opacity='0';
        label?.classList.add('hidden');
        if(fill)fill.style.width='100%';
        if(progressCopy)progressCopy.textContent='Révélation complète';
        if(pageCopy)pageCopy.textContent='Le bon est entièrement découvert.';

        updateRecord(rec.id,{status:'revealed',revealedAt:Date.now()});
        state.currentRecordId=rec.id;
        state.selectedRecordId=rec.id;
        persist();

        setTimeout(()=>finish?.classList.add('visible'),420);
        setTimeout(()=>canvas.style.pointerEvents='none',460);
      }
    }

    canvas.addEventListener('pointerdown',e=>{
      if(completed)return;
      e.preventDefault();
      drawing=true;
      last=point(e);
      scratch(last,last);
      dust(e);
      try{canvas.setPointerCapture(e.pointerId)}catch(_){}
      update(true);
    });

    canvas.addEventListener('pointermove',e=>{
      if(!drawing||completed)return;
      e.preventDefault();
      const p=point(e);
      scratch(last,p);
      last=p;
      dust(e);
      update();
    });

    const end=e=>{
      if(!drawing)return;
      drawing=false;last=null;
      try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
      update(true);
    };
    canvas.addEventListener('pointerup',end);
    canvas.addEventListener('pointercancel',end);
    canvas.addEventListener('lostpointercapture',()=>{drawing=false;last=null;update(true)});

    requestAnimationFrame(sizeCanvas);
  }

  function setupReveal() {
    const stage=document.getElementById('reveal-stage'),instruction=document.getElementById('reveal-instruction'),bar=document.getElementById('reveal-progress');if(!stage)return;const rec=currentRecord();if(!rec)return;let pointer=null,startY=0,p=0,locked=false;const distance=310,threshold=.70;
    const setP=value=>{p=Math.max(0,Math.min(1,value));stage.style.setProperty('--p',p.toFixed(4));if(bar)bar.style.setProperty('--p',p.toFixed(4));const dots=stage.querySelectorAll('.extract-guide-v6 span');dots.forEach((dot,i)=>dot.classList.toggle('active',p>=(i/(dots.length-1))*0.92))};
    const animateTo=(target,duration,done)=>{locked=true;stage.classList.add('settling');const from=p,start=performance.now(),ease=t=>1-Math.pow(1-t,3);const frame=now=>{const t=Math.min(1,(now-start)/duration);setP(from+(target-from)*ease(t));if(t<1)requestAnimationFrame(frame);else{locked=false;stage.classList.remove('settling');done&&done()}};requestAnimationFrame(frame)};
    stage.addEventListener('pointerdown',e=>{if(locked)return;pointer=e.pointerId;startY=e.clientY;stage.classList.add('dragging');try{stage.setPointerCapture(pointer)}catch(_){};instruction.textContent='Le papier commence à glisser…'});
    stage.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||locked)return;setP(Math.max(0,startY-e.clientY)/distance);if(p<.28)instruction.textContent='Le papier se libère…';else if(p<.52)instruction.textContent='Le chèque apparaît…';else if(p<threshold)instruction.textContent='Encore doucement…';else instruction.textContent='Le point de bascule est franchi.'});
    const finish=e=>{if(e.pointerId!==pointer||locked)return;stage.classList.remove('dragging');try{stage.releasePointerCapture(pointer)}catch(_){};pointer=null;if(p>=threshold){instruction.textContent='Le bon est à toi…';if(navigator.vibrate){try{navigator.vibrate(24)}catch(_){}}animateTo(1,760,()=>{stage.classList.add('revealed');updateRecord(rec.id,{status:'revealed',revealedAt:Date.now()});state.selectedRecordId=rec.id;state.currentRecordId=rec.id;persist();setTimeout(()=>navigate('discovered'),620)})}else{instruction.textContent='Tire doucement.';animateTo(0,360)}};
    stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish);stage.addEventListener('lostpointercapture',()=>{if(pointer!==null&&!locked){pointer=null;stage.classList.remove('dragging');instruction.textContent='Tire doucement.';animateTo(0,320)}});
  }



  render();
})();

</script>
</body>
</html>
