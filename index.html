function migrateRecord(r){const x={...r};if(x.momentMode==='giver')x.mode='exceptional';else x.mode=x.mode||'classic';if(x.status==='revealed')x.status='ready';if(x.status==='forced')x.status='validated';if(x.status==='rejected')x.status='replan';if(x.cancelledAt&&x.status==='ready')x.status='replan';return x}

function ticket(r){let moment='';if(r.status==='proposal'&&r.momentAt)moment=`Proposé · ${momentLabel(r.momentAt)}`;else if(r.status==='validated'&&r.momentAt)moment=momentLabel(r.momentAt);else if(r.status==='used'&&r.usedAt)moment=`Vécu · ${momentLabel(r.usedAt)}`;return `<article class="ticket ${r.color||'red'}"><div class="ticket-month">${monthStamp(r.offeredAt||now())}</div><div class="ticket-kicker">BON POUR</div><h2 class="ticket-title">${esc(r.title)}</h2>${r.message?`<p class="ticket-message">${esc(r.message)}</p>`:''}${moment?`<div class="ticket-moment">${esc(moment)}</div>`:''}</article>`}
function miniState(r){if(r.status==='used')return 'Vécu';if(r.status==='validated')return momentLabel(r.momentAt);if(r.status==='proposal')return r.direction==='sent'?'À valider':'En attente';if(r.status==='offered')return r.direction==='sent'?'Envoyé':'À découvrir';if(r.status==='rejected')return 'À replanifier';return 'À utiliser'}

function proposalOwner(r){return r.mode==='exceptional'?'giver':'recipient'}

function categoryOf(r){
 if(r.status==='used')return r.direction==='received'?'used':'offeredUsed';
 if(r.status==='offered')return r.direction==='received'?'discover':'sent';
 if(r.status==='validated')return'planned';

function sendDraft(){syncDraft();const d=state.draft;if(!d.title){toast('Ajoute un titre');return}if(d.exceptional&&forcedRemaining()<=0){toast('Tes 2 possibilités ont déjà été utilisées');return}if(d.exceptional&&d.exceptionWhen==='date'&&!d.momentAt){toast('Choisis le moment');return}const momentAt=d.exceptional?(d.exceptionWhen==='now'?iso(now()):new Date(d.momentAt).toISOString()):null;const r={id:uid(),title:d.title,message:d.message,offeredAt:iso(now()),direction:'sent',status:'offered',mode:d.exceptional?'exceptional':'classic',momentAt,color:COLORS[state.records.length%COLORS.length],exceptionWhen:d.exceptional?d.exceptionWhen:null};state.records.push(r);state.draft=null;save();modal('Bon envoyé.','Il attend maintenant d’être découvert.',[{key:'ok',label:'Retour à l’accueil',fn:()=>go('home','home')}])}
function defaultPlanDate(){const dt=new Date(Date.now()+3*86400000);dt.setHours(20,0,0,0);return new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function planModal(id){const r=state.records.find(x=>x.id===id);if(!r||!isOwner(r))return;document.querySelector('#overlay').innerHTML=`<div class="modal-wrap"><div class="modal"><h2>Choisir le moment</h2><div class="field" style="margin-top:18px"><label>Date et heure</label><input id="plan-date" type="datetime-local" value="${defaultPlanDate()}"></div>${r.mode==='exceptional'?'<button class="text-action" id="plan-now">Proposer maintenant</button>':''}<div class="modal-actions"><button class="btn" id="plan-save">Proposer cette date</button><button class="btn secondary" id="plan-cancel">Annuler</button></div></div></div>`;document.querySelector('#plan-cancel').onclick=()=>document.querySelector('#overlay').innerHTML='';document.querySelector('#plan-save').onclick=()=>submitProposal(r,new Date(document.querySelector('#plan-date').value).toISOString(),'date');const n=document.querySelector('#plan-now');if(n)n.onclick=()=>submitProposal(r,iso(now()),'now')}
function submitProposal(r,date,kind){if(!date)return;r.momentAt=date;r.exceptionWhen=kind;r.status='proposal';r.proposedAt=iso(now());delete r.validatedAt;save();document.querySelector('#overlay').innerHTML='';go('detail:'+r.id,state.backView||'home');toast('Proposition envoyée')}
function accept(id){const r=state.records.find(x=>x.id===id);if(!r)return;if(r.exceptionWhen==='now'){r.momentAt=iso(now());r.status='used';r.usedAt=r.momentAt}else{r.status='validated';r.validatedAt=iso(now())}save();render();toast(r.status==='used'?'Bon utilisé':'Moment confirmé')}
function reject(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.status='replan';r.rejectedAt=iso(now());r.momentAt=null;r.exceptionWhen=null;save();render();toast('Proposition refusée')}
function cancelMoment(id){const r=state.records.find(x=>x.id===id);if(!r||r.status!=='validated')return;modal('Annuler ce moment ?','Le bon restera disponible. La personne qui choisit habituellement le moment pourra en proposer un nouveau.',[{key:'yes',label:'Annuler le moment',fn:()=>{r.status='replan';r.cancelledAt=iso(now());r.momentAt=null;delete r.validatedAt;save();render();toast('Moment annulé')}},{key:'no',label:'Garder le moment',secondary:true,fn:()=>{}}])}
function togglePerspective(){state.perspective=state.perspective==='recipient'?'giver':'recipient';for(const r of state.records)r.direction=r.direction==='received'?'sent':'received';state.view='home';state.backView='home';save();render();toast(state.perspective==='recipient'?'Vue principale':'Vue partenaire')}
function resetAll(){modal('Réinitialiser ?','Tous les bons locaux de cette V2.1 seront supprimés.',[{key:'yes',label:'Réinitialiser',fn:()=>{state=baseState();save();render()}},{key:'no',label:'Annuler',secondary:true,fn:()=>{}}])}
function toggleDemo(){if(state.demo){const backup=state.demoBackup||baseState();state={...baseState(),...backup,view:'settings',demo:false};save();render();toast('Données normales restaurées');return}const backup=JSON.parse(JSON.stringify({...state,demo:false}));state=demoState();state.demoBackup=backup;save();render();toast('Mode démo activé')}
function demoState(){const s=baseState();s.demo=true;const today=new Date();const make=(i,title,message,direction,status,mode='classic',daysAgo=20,momentOffset=null)=>({id:'demo-'+i,title,message,offeredAt:iso(addDays(today,-daysAgo)),direction,status,mode,color:COLORS[i%COLORS.length],momentAt:momentOffset===null?null:iso(addDays(today,momentOffset)),usedAt:status==='used'?iso(addDays(today,momentOffset??-daysAgo+5)):null});
 const data=[
  make(0,'Un dîner en amoureux','Je t’invite, tu choisis le moment.','received','ready','classic',8),
  make(1,'Une escapade surprise','Une journée rien que nous deux.','received','proposal','classic',14,6),
  make(2,'Une soirée cinéma','Tu choisis le film.','sent','proposal','classic',11,3),
  make(3,'Une nuit rien que nous','Ce soir, j’ai très envie de toi.','received','proposal','exceptional',1,0),
  make(4,'Un massage maison','Une vraie pause.','received','rejected','classic',16),
  make(5,'Une table surprise','Je réserve, tu découvres.','received','validated','classic',22,9),
  make(6,'Un dimanche ailleurs','Aucune montre nécessaire.','sent','validated','classic',19,13),
  make(7,'Une surprise après le travail','Sois prêt(e).','received','offered','classic',0),
  make(8,'Petit-déjeuner au lit','Tu ne t’occupes de rien.','sent','offered','classic',2),
  make(9,'Une soirée mystère','Tu n’as rien à préparer.','sent','rejected','exceptional',12),
 ];
 let id=10;for(let m=1;m<=6;m++){for(let j=0;j<5;j++){const idea=IDEAS[(m*3+j)%IDEAS.length];const off=addDays(addMonths(today,-m),-(j*4+2));const used=addDays(off,5+j);data.push({id:'demo-'+id++,title:idea.title,message:j===3?'':idea.message,offeredAt:iso(off),direction:j%2?'sent':'received',status:'used',mode:j===2&&m===2?'exceptional':'classic',color:COLORS[id%COLORS.length],momentAt:iso(used),usedAt:iso(used)})}}
 s.records=data;return s}
function finishScratch(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.revealedAt=iso(now());r.status=r.mode==='exceptional'?'proposal':'ready';save();setTimeout(()=>{const cat=categoryOf(r);state.view='detail:'+r.id;state.backView='category:'+cat;save();render();toast('Bon découvert')},550)}
function initScratch(){const c=document.querySelector('[data-canvas]');if(!c)return;const wrap=c.parentElement,rect=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const g=ctx.createLinearGradient(0,0,rect.width,rect.height);g.addColorStop(0,'#d6c5aa');g.addColorStop(.45,'#9f8d79');g.addColorStop(1,'#6f6272');ctx.fillStyle=g;ctx.fillRect(0,0,rect.width,rect.height);ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='800 12px -apple-system';ctx.textAlign='center';ctx.fillText('GRATTE ICI',rect.width/2,rect.height/2);ctx.globalCompositeOperation='destination-out';let drawing=false,last=null,done=false;function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function scratchAt(pt){ctx.beginPath();ctx.arc(pt.x,pt.y,28,0,Math.PI*2);ctx.fill();if(last){ctx.lineWidth=56;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(pt.x,pt.y);ctx.stroke()}last=pt}function check(){if(done)return;const img=ctx.getImageData(0,0,c.width,c.height).data;let clear=0,total=0;for(let i=3;i<img.length;i+=4*32){total++;if(img[i]<30)clear++}const ratio=clear/Math.max(1,total);const bar=document.querySelector('[data-progress]');if(bar)bar.style.width=Math.min(100,ratio*150)+'%';if(ratio>.62){done=true;c.style.pointerEvents='none';c.animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'});setTimeout(()=>finishScratch(c.dataset.id),400)}}c.addEventListener('pointerdown',e=>{drawing=true;last=null;c.setPointerCapture(e.pointerId);scratchAt(p(e))});c.addEventListener('pointermove',e=>{if(drawing){scratchAt(p(e));e.preventDefault()}});c.addEventListener('pointerup',()=>{drawing=false;last=null;check()});c.addEventListener('pointercancel',()=>{drawing=false;last=null})}
function installGuards(){const multi=e=>{if(e.touches&&e.touches.length>1)e.preventDefault()};document.addEventListener('touchstart',multi,{passive:false});document.addEventListener('touchmove',multi,{passive:false});['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>e.preventDefault(),{passive:false}));document.addEventListener('visibilitychange',()=>{if(!document.hidden){normalize();render()}});setInterval(()=>{const before=state.records.filter(r=>r.status==='used').length;normalize();const after=state.records.filter(r=>r.status==='used').length;if(after!==before)render()},60000)}
installGuards();render();
</script>
