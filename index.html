<style>
:root{
  --bg:#100d15;--bg2:#17121d;--panel:#1c1622;--panel2:#251c2e;
  --ink:#fff8ec;--muted:#9c929f;--muted2:#716978;--line:rgba(255,248,236,.11);

  --nav-h:70px;--shadow:0 24px 70px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{touch-action:manipulation;cursor:pointer}button:disabled{opacity:.4;cursor:default}
#app{position:fixed;inset:0;width:100%;height:auto;overflow:hidden;isolation:isolate;background:linear-gradient(155deg,#0d0b12 0%,#12101a 48%,#0e0b13 100%)}
#app::before{content:"";position:absolute;z-index:0;pointer-events:none;width:125%;height:34%;left:-18%;top:-13%;border-radius:38% 62% 54% 46%/58% 42% 58% 42%;background:linear-gradient(118deg,rgba(83,64,150,.28),rgba(35,28,69,.06) 47%,rgba(190,139,78,.10));filter:blur(18px);transform:rotate(-7deg);animation:ambientA 18s ease-in-out infinite alternate}
#app::after{content:"";position:absolute;z-index:0;pointer-events:none;width:120%;height:31%;right:-36%;bottom:-16%;border-radius:64% 36% 42% 58%/44% 60% 40% 56%;background:linear-gradient(132deg,rgba(34,30,72,.04),rgba(82,54,122,.18) 46%,rgba(147,74,72,.08));filter:blur(24px);transform:rotate(9deg);animation:ambientB 22s ease-in-out infinite alternate}
.app-frame{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}.app-frame.immersive{grid-template-rows:minmax(0,1fr)}
.scroll-stage{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;scrollbar-width:none;position:relative;touch-action:pan-y;scroll-behavior:auto}.scroll-stage::-webkit-scrollbar{display:none}
.screen{width:min(100%,700px);min-width:0;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 30px max(18px,env(safe-area-inset-left));overflow-x:hidden}
.bottom-nav{position:relative;z-index:1000;width:100%;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:5px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#120e17;border-top:1px solid rgba(255,248,236,.1);box-shadow:0 -10px 34px rgba(0,0,0,.25);isolation:isolate}
.nav-item{border:0;background:transparent;color:#77707c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;font-size:10.5px;font-weight:650}.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.nav-item.active{color:var(--ink)}.nav-item.active svg{stroke:var(--red)}.nav-dot{width:3px;height:3px;border-radius:50%;background:transparent}.nav-item.active .nav-dot{background:var(--red);box-shadow:0 0 12px var(--red)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.brand{font-size:12px;font-weight:850;letter-spacing:.25em;text-transform:uppercase}.brand i{color:var(--red);font-style:normal}.top-title{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#a59ba7}.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.025);display:grid;place-items:center}.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:var(--red2);margin:0 0 9px}.display{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.045em;font-size:clamp(44px,12vw,68px);line-height:.95;margin:0}.display em{font-style:italic;color:var(--red2)}.lead{font-size:16px;line-height:1.45;color:var(--muted);margin:16px 0 0;max-width:500px}
.hero{padding:6px 0 16px}.hero-visual{height:92px;margin:10px -18px 0;position:relative;overflow:hidden;isolation:isolate}.hero-visual::before{content:"";position:absolute;width:118%;height:92px;left:-12%;top:16px;border-radius:46% 54% 63% 37%/58% 42% 58% 42%;background:linear-gradient(108deg,transparent 2%,rgba(70,55,126,.16) 24%,rgba(120,81,153,.32) 53%,rgba(174,121,91,.10) 76%,transparent 96%);filter:blur(2px);transform:rotate(-6deg)}.hero-visual::after{content:"";position:absolute;width:96%;height:58px;left:15%;top:34px;border-radius:57% 43% 34% 66%/54% 61% 39% 46%;border-top:1px solid rgba(213,199,224,.16);background:linear-gradient(105deg,transparent,rgba(255,255,255,.018),transparent);transform:rotate(4deg)}
.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}.section-title{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;margin:0}.text-link{border:0;background:transparent;color:var(--red2);font-size:13px;font-weight:750;padding:7px 0}.subtle{color:var(--muted);font-size:13px;line-height:1.4}
.focus-card{border:1px solid rgba(255,77,109,.25);background:linear-gradient(135deg,rgba(255,77,109,.13),rgba(139,92,246,.06));border-radius:24px;padding:18px;margin:12px 0}.focus-card .focus-label{font-size:10px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;color:var(--red2)}.focus-card h2{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:400;line-height:1.02;margin:13px 0 6px}.focus-card p{color:var(--muted);font-size:14px;line-height:1.4;margin:0}.focus-card button{margin-top:16px}
.inbox-list{display:grid;gap:8px}.inbox-row{width:100%;border:1px solid var(--line);background:#18131e;border-radius:18px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:12px;text-align:left;align-items:center}.inbox-row strong{display:block;font-size:15px}.inbox-row small{display:block;color:var(--muted);margin-top:4px;line-height:1.3}.inbox-row .arrow{font-size:22px;color:#706877;font-weight:300}.inbox-row.attention{border-color:rgba(255,77,109,.25)}
.home-actions{display:grid;grid-template-columns:1.25fr .9fr;gap:11px;margin-top:30px}.home-tile{min-height:118px;border:1px solid var(--line);border-radius:23px;padding:17px;text-align:left;background:#19141f;position:relative;overflow:hidden}.home-tile.primary{background:linear-gradient(145deg,#ef4667,#9b2b62 72%,#4e1e4d);border-color:transparent}.home-tile strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:23px;font-weight:400;line-height:1.06}.home-tile small{display:block;color:rgba(255,248,236,.62);font-size:12px;line-height:1.35;margin-top:8px}.home-tile .count{position:absolute;right:15px;bottom:11px;font-family:Georgia,"Times New Roman",serif;font-size:34px;color:rgba(255,248,236,.26)}
.btn{width:100%;min-height:54px;border-radius:17px;border:1px solid transparent;background:var(--red);color:white;font-weight:800;padding:13px 17px;box-shadow:0 13px 28px rgba(255,77,109,.14)}.btn.secondary{background:#211a28;border-color:var(--line);box-shadow:none}.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:#c3b9c4}.btn.inline{width:auto;min-height:46px;padding:10px 16px}.action-stack{display:grid;gap:9px;margin-top:18px}.text-action{border:0;background:transparent;color:#aaa0ac;padding:11px 4px;font-weight:700;font-size:13px}.danger-link{color:#d18c99}
.ticket{--accent:var(--red);position:relative;border-radius:27px;padding:22px;min-height:255px;overflow:hidden;background:linear-gradient(145deg,#24172b,#17131c 68%);border:1px solid rgba(255,248,236,.12);box-shadow:var(--shadow)}.ticket::after{content:"";position:absolute;width:165px;height:165px;border-radius:50%;right:-70px;top:-70px;background:var(--accent);opacity:.14}.ticket.violet{--accent:var(--violet)}.ticket.amber{--accent:var(--amber)}.ticket.mint{--accent:var(--mint)}.ticket.red{--accent:var(--red)}.ticket-month{font-size:10px;font-weight:850;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}.ticket-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#817887;margin-top:38px}.ticket-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(33px,9vw,50px);line-height:.99;letter-spacing:-.035em;font-weight:400;margin:8px 0 0;max-width:92%}.ticket-message{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#b4aab5;font-size:17px;line-height:1.3;margin:15px 0 0;max-width:90%}.ticket-moment{display:inline-flex;align-items:center;gap:8px;margin-top:22px;border-top:1px solid var(--line);padding-top:13px;font-size:13px;font-weight:750}.ticket-moment::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.ticket-mini{--accent:var(--red);width:100%;border:1px solid var(--line);background:linear-gradient(145deg,#211827,#17131d);border-radius:20px;padding:16px;text-align:left;position:relative;overflow:hidden}.ticket-mini.violet{--accent:var(--violet)}.ticket-mini.amber{--accent:var(--amber)}.ticket-mini.mint{--accent:var(--mint)}.ticket-mini.red{--accent:var(--red)}.ticket-mini::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-44px;top:-42px;background:var(--accent);opacity:.12}.ticket-mini .mini-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.ticket-mini .mini-month{font-size:9px;font-weight:850;letter-spacing:.18em;color:var(--accent)}.ticket-mini .mini-state{font-size:10px;color:#918793}.ticket-mini strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;line-height:1.04;margin-top:18px;max-width:88%}.ticket-mini small{display:block;color:var(--muted);font-size:12px;margin-top:8px;line-height:1.3}.ticket-grid{display:grid;gap:11px}
.hub-grid{display:grid;gap:12px;margin-top:25px}.hub-card{width:100%;border:1px solid var(--line);border-radius:24px;background:#18131e;padding:20px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}.hub-card strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:28px;font-weight:400}.hub-card small{display:block;color:var(--muted);margin-top:6px;line-height:1.35}.hub-card .hub-count{font-family:Georgia,"Times New Roman",serif;font-size:40px;color:#625969}.hub-card.used .hub-count{color:#8b7d90}.hub-card.sent .hub-count{color:#7b5970}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:20px 0}.tab{border:0;background:transparent;color:#77707c;padding:11px 0 13px;font-size:13px;font-weight:750;position:relative}.tab.active{color:var(--ink)}.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red)}
.detail-status{margin:20px 0 0;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.detail-status .status-label{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2)}.detail-status strong{display:block;font-size:16px;margin-top:6px}.detail-status p{color:var(--muted);font-size:13px;line-height:1.4;margin:5px 0 0}.detail-actions{margin-top:20px}.detail-actions .btn+.text-action{margin-top:4px}
.form{display:grid;gap:18px;margin-top:23px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#978d9a;margin:0 0 8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#19141f;border-radius:17px;padding:15px;outline:none;font-size:16px}.field textarea{min-height:105px;resize:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,77,109,.6);box-shadow:0 0 0 3px rgba(255,77,109,.07)}
.options-link{width:100%;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:15px 2px;display:flex;align-items:center;justify-content:space-between;text-align:left}.options-link strong{font-size:14px}.options-link small{display:block;color:var(--muted);margin-top:3px}.options-link span:last-child{font-size:20px;color:#756c79}.exception-box{border:1px solid rgba(255,202,106,.2);background:rgba(255,202,106,.04);border-radius:20px;padding:16px}.exception-box h3{font-size:15px;margin:0}.exception-box p{font-size:13px;color:var(--muted);line-height:1.4;margin:6px 0 0}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.choice{border:1px solid var(--line);background:#19141f;border-radius:16px;padding:13px;text-align:left}.choice.active{border-color:rgba(255,202,106,.55);background:rgba(255,202,106,.07)}.choice strong{font-size:13px}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.intent-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px}.intent{min-height:145px;border:1px solid var(--line);border-radius:23px;padding:17px;background:linear-gradient(145deg,#211827,#17131d);text-align:left;position:relative;overflow:hidden}.intent::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;top:-30px;background:var(--intent);opacity:.15}.intent strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:400;line-height:1.02;margin-top:48px}.intent small{display:block;color:var(--muted);font-size:11px;margin-top:7px}.intent.romance{--intent:var(--red)}.intent.care{--intent:var(--mint)}.intent.fun{--intent:var(--amber)}.intent.escape{--intent:var(--violet)}.intent.surprise{--intent:#ff77c8}.intent.custom{--intent:#fff8ec}
.idea-list{display:grid;gap:9px;margin-top:20px}.idea-row{width:100%;border:1px solid var(--line);background:#18131e;border-radius:18px;padding:15px;text-align:left}.idea-row strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:400}.idea-row small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:5px}
.setting-card{border-top:1px solid var(--line);padding:18px 0}.setting-card:first-child{border-top:0}.setting-card h3{margin:0;font-size:15px}.setting-card p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.4}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--red2)}
.modal-wrap{position:fixed;z-index:3000;inset:0;background:rgba(6,4,9,.76);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));backdrop-filter:blur(9px)}.modal{width:min(100%,680px);background:#1c1622;border:1px solid var(--line);border-radius:28px;padding:21px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal h2{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:400;margin:0}.modal p{color:var(--muted);font-size:13px;line-height:1.45}.modal-actions{display:grid;gap:9px;margin-top:18px}
.scratch-page{min-height:100%;display:flex;flex-direction:column;justify-content:center}.scratch-head{text-align:center;margin-bottom:22px}.scratch-head h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;font-weight:400;margin:7px 0}.scratch-wrap{position:relative;border-radius:29px;overflow:hidden;box-shadow:var(--shadow)}.scratch-wrap .ticket{border-radius:29px;min-height:325px}.scratch-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:5}.scratch-progress{height:3px;background:#2d2532;border-radius:99px;overflow:hidden;margin:19px 14px 0}.scratch-progress i{display:block;height:100%;background:var(--red);width:0;box-shadow:0 0 14px var(--red)}.scratch-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:9px}
.empty{border:1px dashed rgba(255,248,236,.14);border-radius:22px;padding:31px 20px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:4000;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:#fff8ec;color:#17121d;padding:10px 14px;border-radius:999px;font-weight:750;font-size:12px;box-shadow:0 12px 35px rgba(0,0,0,.3);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* V2.1.1 — Présent & Carnet */
.present-hero{padding:8px 0 18px}
.present-hero .display{max-width:620px}
.home-focus{margin-top:22px}
.home-focus .ticket{margin-top:14px}
.focus-shell{border:1px solid rgba(255,77,109,.22);background:linear-gradient(145deg,rgba(255,77,109,.105),rgba(139,92,246,.035));border-radius:28px;padding:18px}
.focus-shell.today{border-color:rgba(255,202,106,.25);background:linear-gradient(145deg,rgba(255,202,106,.08),rgba(139,92,246,.035))}
.focus-shell .focus-overline{font-size:10px;font-weight:850;letter-spacing:.2em;text-transform:uppercase;color:var(--red2)}
.focus-shell.today .focus-overline{color:var(--amber)}
.focus-shell h2{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:400;line-height:1.02;letter-spacing:-.025em;margin:10px 0 6px}
.focus-shell p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.focus-shell .focus-time{display:block;margin-top:13px;font-size:13px;font-weight:780;color:var(--ink)}
.create-primary{width:100%;margin-top:26px;min-height:92px;border:0;border-radius:24px;padding:18px 20px;text-align:left;background:linear-gradient(145deg,#ef4667,#9b2b62 72%,#4e1e4d);position:relative;overflow:hidden}
.create-primary::after{content:"+";position:absolute;right:20px;top:50%;transform:translateY(-52%);font-family:Georgia,"Times New Roman",serif;font-size:48px;font-weight:300;color:rgba(255,255,255,.55)}
.create-primary strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:400}
.create-primary small{display:block;margin-top:5px;color:rgba(255,248,236,.68);font-size:12px}
.carnet-intro{margin-bottom:24px}
.state-group{margin-top:26px}
.state-group-title{font-size:10px;font-weight:850;letter-spacing:.19em;text-transform:uppercase;color:#766e7a;margin:0 0 10px}
.state-index{display:grid;gap:9px}
.state-card{--state-accent:var(--red);width:100%;border:1px solid var(--line);border-radius:20px;background:#18131e;padding:16px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;position:relative;overflow:hidden}
.state-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:4px;background:var(--state-accent);opacity:.85}
.state-card strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:400;line-height:1.04}
.state-card small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:5px;max-width:430px}
.state-card .state-count{font-family:Georgia,"Times New Roman",serif;font-size:34px;color:#746b78;min-width:28px;text-align:right}
.state-card.discover{--state-accent:var(--red)}
.state-card.plan{--state-accent:var(--mint)}
.state-card.validate{--state-accent:var(--amber)}
.state-card.replan{--state-accent:#ff77c8}
.state-card.waiting{--state-accent:#817887}
.state-card.planned{--state-accent:var(--violet)}
.state-card.sent{--state-accent:#9c929f}
.state-card.used{--state-accent:var(--mint)}
.state-card.offered-used{--state-accent:var(--violet)}
.category-head{margin-bottom:22px}
.category-head .category-action{font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 0;max-width:520px}
.category-list{display:grid;gap:11px}
.category-list .ticket-mini .mini-state{display:none}
.category-list .ticket-mini strong{margin-top:16px}
.category-empty{margin-top:24px}
.archive-divider{height:1px;background:var(--line);margin:28px 0 0}
.home-carnet-link{margin-top:14px;width:100%;border:0;background:transparent;color:#8f8593;font-size:13px;font-weight:720;padding:10px}



@keyframes ambientA{from{transform:translate3d(-1.5%,0,0) rotate(-7deg) scale(1)}to{transform:translate3d(2.5%,2%,0) rotate(-4deg) scale(1.035)}}
@keyframes ambientB{from{transform:translate3d(0,1%,0) rotate(9deg) scale(1)}to{transform:translate3d(-3%,-2%,0) rotate(6deg) scale(1.04)}}
/* V2.2 — fluidité, dimensions et privilège annuel */
.screen>*,.form,.field,.exception-box,.choice-row,.choice,.modal,.modal-actions,.state-card,.ticket,.ticket-mini,.intent,.idea-row,.focus-shell{min-width:0;max-width:100%}

.choice-row{grid-template-columns:repeat(2,minmax(0,1fr))}.state-card>span:first-child,.options-link>span:first-child{min-width:0}.choice{min-width:0;overflow:hidden}.choice strong,.choice small,.options-link span:first-child{overflow-wrap:anywhere}

function exceptionalRemainingFor(r){const y=new Date().getFullYear();const direction=r.direction==='received'?'received':'sent';return Math.max(0,2-state.records.filter(x=>x.direction===direction&&x.mode==='exceptional'&&new Date(x.offeredAt).getFullYear()===y).length)}

function miniState(r){if(r.status==='used')return 'Vécu';if(r.status==='validated')return momentLabel(r.momentAt);if(r.status==='proposal')return isOwner(r)?'En attente':'À valider';if(r.status==='offered')return r.direction==='sent'?'Envoyé':'À découvrir';if(r.status==='rejected')return 'À replanifier';return 'À utiliser'}
function ticketMini(r){const exceptional=r.mode==='exceptional';return `<button class="ticket-mini ${r.color||'red'} ${exceptional?'exceptional':''}" data-detail="${r.id}"><div class="mini-top"><span class="mini-month">${monthStamp(r.offeredAt||now())}</span><span class="mini-state">${esc(miniState(r))}</span></div>${exceptional?`<span class="exception-badge">${esc(exceptionBadgeText(r))}</span>`:''}<strong>${esc(r.title)}</strong>${r.message?`<small>${esc(r.message)}</small>`:''}</button>`}

function isOwner(r){return (proposalOwner(r)==='giver'&&r.direction==='sent')||(proposalOwner(r)==='recipient'&&r.direction==='received')}
function actionKind(r){if(r.direction==='received'&&r.status==='offered')return'scratch';if(r.status==='proposal'&&!isOwner(r))return'decide';if(r.status==='ready'&&isOwner(r))return'plan';if(['replan','rejected'].includes(r.status)&&isOwner(r))return'plan';return null}
function isSameLocalDay(a,b=new Date()){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate()}

function categoryOf(r){
 if(r.status==='used')return r.direction==='received'?'used':'offeredUsed';
 if(r.status==='offered')return r.direction==='received'?null:'sent';
 if(r.status==='validated')return'planned';
 if(r.status==='proposal')return isOwner(r)?'waiting':'validate';
 if(['replan','rejected'].includes(r.status))return isOwner(r)?'replan':'waiting';
 if(r.status==='ready')return isOwner(r)?'plan':'waiting';
 return'waiting'
}
function categoryRecords(id){return state.records.filter(r=>categoryOf(r)===id).sort((a,b)=>new Date(b.offeredAt||0)-new Date(a.offeredAt||0))}
function categoryMeta(id){return CATEGORIES.find(x=>x.id===id)}
function currentRole(r){return r.direction==='sent'?'giver':'recipient'}
function markEvent(r,type){r.lastEvent={type,at:iso(now()),role:currentRole(r)}}
function eventFromPartner(r,type){return r.lastEvent&&r.lastEvent.type===type&&r.lastEvent.role!==currentRole(r)&&now()-new Date(r.lastEvent.at).getTime()<4*86400000}
function isTomorrow(date){const d=new Date(date),t=new Date();t.setDate(t.getDate()+1);return isSameLocalDay(d,t)}
function newest(list,dateKey='offeredAt'){return list.sort((a,b)=>new Date(b[dateKey]||b.offeredAt||0)-new Date(a[dateKey]||a.offeredAt||0))[0]}
function homeFocus(){
 const today=state.records.filter(r=>r.status==='validated'&&r.momentAt&&isSameLocalDay(r.momentAt)).sort((a,b)=>new Date(a.momentAt)-new Date(b.momentAt))[0];if(today)return{kind:'today',record:today};
 const secret=newest(state.records.filter(r=>r.direction==='received'&&r.status==='offered'));if(secret)return{kind:'discover',record:secret};
 const validate=newest(categoryRecords('validate'),'proposedAt');if(validate)return{kind:'validate',record:validate};
 const cancelled=newest(state.records.filter(r=>eventFromPartner(r,'cancelled')),'cancelledAt');if(cancelled)return{kind:'cancelled',record:cancelled};
 const rejected=newest(state.records.filter(r=>eventFromPartner(r,'rejected')),'rejectedAt');if(rejected)return{kind:'rejected',record:rejected};
 const modified=newest(state.records.filter(r=>eventFromPartner(r,'modified')),'proposedAt');if(modified)return{kind:'modified',record:modified};
 const accepted=newest(state.records.filter(r=>eventFromPartner(r,'accepted')),'validatedAt');if(accepted)return{kind:'accepted',record:accepted};
 const tomorrow=state.records.filter(r=>r.status==='validated'&&r.momentAt&&isTomorrow(r.momentAt)).sort((a,b)=>new Date(a.momentAt)-new Date(b.momentAt))[0];if(tomorrow)return{kind:'tomorrow',record:tomorrow};
 return null
}

function finishScratch(id){const r=state.records.find(x=>x.id===id);if(!r)return;r.revealedAt=iso(now());r.status=r.mode==='exceptional'?'proposal':'ready';markEvent(r,'discovered');save();setTimeout(()=>{replaceView('detail:'+r.id);toast('Bon découvert')},550)}
function initScratch(){const c=document.querySelector('[data-canvas]');if(!c)return;const wrap=c.parentElement,rect=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const g=ctx.createLinearGradient(0,0,rect.width,rect.height);g.addColorStop(0,'#d6c5aa');g.addColorStop(.45,'#9f8d79');g.addColorStop(1,'#6f6272');ctx.fillStyle=g;ctx.fillRect(0,0,rect.width,rect.height);ctx.fillStyle='rgba(255,255,255,.22)';ctx.font='800 12px -apple-system';ctx.textAlign='center';ctx.fillText('GRATTE ICI',rect.width/2,rect.height/2);c.style.background='transparent';ctx.globalCompositeOperation='destination-out';let drawing=false,last=null,done=false;function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function scratchAt(pt){ctx.beginPath();ctx.arc(pt.x,pt.y,28,0,Math.PI*2);ctx.fill();if(last){ctx.lineWidth=56;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(pt.x,pt.y);ctx.stroke()}last=pt}function check(){if(done)return;const img=ctx.getImageData(0,0,c.width,c.height).data;let clear=0,total=0;for(let i=3;i<img.length;i+=4*32){total++;if(img[i]<30)clear++}const ratio=clear/Math.max(1,total);const bar=document.querySelector('[data-progress]');if(bar)bar.style.width=Math.min(100,ratio*150)+'%';if(ratio>.62){done=true;c.style.pointerEvents='none';c.animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'});setTimeout(()=>finishScratch(c.dataset.id),400)}}c.addEventListener('pointerdown',e=>{drawing=true;last=null;c.setPointerCapture(e.pointerId);scratchAt(p(e))});c.addEventListener('pointermove',e=>{if(drawing){scratchAt(p(e));e.preventDefault()}});c.addEventListener('pointerup',()=>{drawing=false;last=null;check()});c.addEventListener('pointercancel',()=>{drawing=false;last=null})}
function installGuards(){const multi=e=>{if(e.touches&&e.touches.length>1)e.preventDefault()};document.addEventListener('touchstart',multi,{passive:false});document.addEventListener('touchmove',multi,{passive:false});['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>e.preventDefault(),{passive:false}));let sx=0,sy=0,tracking=false,indicator=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.touches[0].clientX>30||document.querySelector('#overlay').children.length||(e.target.closest&&e.target.closest('input,textarea,select,.scratch-canvas'))){tracking=false;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;indicator=document.createElement('i');indicator.className='swipe-indicator';document.body.appendChild(indicator)},{passive:true});document.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;const dx=e.touches[0].clientX-sx,dy=Math.abs(e.touches[0].clientY-sy);if(dy>Math.max(18,Math.abs(dx)*.75)){tracking=false;if(indicator)indicator.remove();return}if(dx>10)e.preventDefault();if(dx>24&&indicator)indicator.classList.add('show')},{passive:false});document.addEventListener('touchend',e=>{if(!tracking){if(indicator)indicator.remove();indicator=null;return}const t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);tracking=false;if(indicator)indicator.remove();indicator=null;if(dx>78&&dy<55)back()},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.client&&cloud.couple?.is_complete)syncCloud({quiet:true}).then(()=>rerenderHere())});setInterval(()=>{if(cloud.client&&cloud.couple?.is_complete)syncCloud({quiet:true}).then(()=>{if(!document.hidden)rerenderHere()})},60000)}
const CLOUD_CONFIG_STORAGE='couple-v3-supabase-config';
const CLOUD_META_STORAGE='couple-v3-cloud-meta';
const cloud={client:null,user:null,couple:null,channel:null,busy:false,installPrompt:null,pairTimer:null};


function loadSupabaseLibrary(){return new Promise((resolve,reject)=>{if(window.supabase?.createClient){resolve();return}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.async=true;script.onload=()=>resolve();script.onerror=()=>reject(new Error('SUPABASE_LIBRARY_UNAVAILABLE'));document.head.appendChild(script)})}
function cloudConfig(){
  let local={};try{local=JSON.parse(localStorage.getItem(CLOUD_CONFIG_STORAGE)||'{}')}catch{}
  const file=window.COUPLE_CONFIG||{};
  return {url:(local.url||file.url||'').trim(),key:(local.key||file.key||'').trim()}
}
function validCloudConfig(c){return /^https:\/\/.+\.supabase\.co\/?$/.test(c.url)&&c.key.length>20}
function cloudErrorMessage(error){const raw=String(error?.message||error||'Erreur inconnue');const map={AUTH_REQUIRED:'Connexion requise',DISPLAY_NAME_REQUIRED:'Ajoute ton prénom',ALREADY_IN_COUPLE:'Ce compte appartient déjà à un couple',INVALID_INVITE_CODE:'Code d’invitation invalide',COUPLE_FULL:'Ce couple contient déjà deux personnes',PARTNER_REQUIRED:'Ton partenaire doit d’abord rejoindre votre espace',CATALOGUE_LIMIT:'Tes 11 bons du catalogue ont déjà été choisis cette année',CATEGORY_LIMIT:'Cet univers a déjà atteint 3 choix cette année',CUSTOM_LIMIT:'Ton joker annuel a déjà été utilisé',EXCEPTION_LIMIT:'Tes 2 privilèges annuels ont déjà été utilisés',MOMENT_REQUIRED:'Choisis une date',NOT_PROPOSAL_OWNER:'Ce n’est pas à toi de proposer la date',NOT_APPROVER:'Cette proposition attend la réponse de ton partenaire',INVALID_STATE:'Ce bon a déjà changé d’état. Actualise l’application.'};for(const [k,v] of Object.entries(map))if(raw.includes(k))return v;return raw.replace(/^.*?error:\s*/i,'')}
function setCloudBusy(on,label=''){cloud.busy=on;document.querySelectorAll('[data-cloud-action]').forEach(b=>b.disabled=on);const el=document.querySelector('[data-cloud-status]');if(el&&label)el.textContent=label}
function cloudShell(content){document.querySelector('#app').innerHTML=`<main class="cloud-shell"><section class="cloud-screen"><div class="cloud-brand">COUPLE<i>.</i></div>${content}</section></main>`}
function setupScreen(){const c=cloudConfig();cloudShell(`<div class="cloud-hero"><p class="eyebrow">Première connexion</p><h1>Relier<br><em>vos deux téléphones.</em></h1><p>Renseigne le projet Supabase utilisé par Couple. La clé demandée est la clé publique/publishable, jamais une clé service_role.</p></div><div class="cloud-card"><div class="field"><label>URL Supabase</label><input id="cloud-url" inputmode="url" placeholder="https://xxxxx.supabase.co" value="${esc(c.url)}"></div><div class="field"><label>Clé publishable</label><textarea id="cloud-key" class="cloud-key" placeholder="sb_publishable_…">${esc(c.key)}</textarea></div><button class="btn" data-cloud-action="save-config">Enregistrer la connexion</button><p class="cloud-help">Ces deux valeurs peuvent aussi être inscrites une fois pour toutes dans <strong>config.js</strong> avant la mise en ligne.</p></div>`);bindCloudOnboarding()}
function authScreen(note=''){cloudShell(`<div class="cloud-hero"><p class="eyebrow">Espace privé</p><h1>Rien que<br><em>vous deux.</em></h1><p>Chaque personne possède son propre accès. Vos bons sont ensuite synchronisés dans un espace commun.</p></div>${note?`<div class="cloud-note">${esc(note)}</div>`:''}<div class="cloud-card"><div class="field"><label>E-mail</label><input id="auth-email" type="email" autocomplete="email" placeholder="vous@exemple.fr"></div><div class="field"><label>Mot de passe</label><input id="auth-password" type="password" autocomplete="current-password" minlength="8" placeholder="8 caractères minimum"></div><button class="btn" data-cloud-action="signin">Se connecter</button><button class="btn secondary" data-cloud-action="signup">Créer mon accès</button><button class="text-action cloud-config-link" data-cloud-action="config">Configuration technique</button><p class="cloud-status" data-cloud-status></p></div>`);bindCloudOnboarding()}
function pairingScreen(){cloudShell(`<div class="cloud-hero"><p class="eyebrow">Votre espace à deux</p><h1>Former<br><em>votre couple.</em></h1><p>Une seule personne crée l’espace. L’autre le rejoint avec le code temporaire.</p></div><div class="cloud-card"><div class="field"><label>Ton prénom</label><input id="pair-name" maxlength="40" autocomplete="given-name" placeholder="Prénom"></div><button class="btn" data-cloud-action="create-couple">Créer notre espace</button><div class="cloud-or"><span>ou</span></div><div class="field"><label>Code reçu</label><input id="pair-code" class="pair-code-input" maxlength="8" autocapitalize="characters" placeholder="A1B2C3D4"></div><button class="btn secondary" data-cloud-action="join-couple">Rejoindre mon partenaire</button><p class="cloud-status" data-cloud-status></p></div>`);bindCloudOnboarding()}
function waitingPartnerScreen(invite=''){const name=cloud.couple?.my_name||'';cloudShell(`<div class="cloud-hero"><p class="eyebrow">Invitation</p><h1>À deux,<br><em>pour de vrai.</em></h1><p>${esc(name?name+', votre espace est créé.':'Votre espace est créé.')} Il ne manque plus que l’autre téléphone.</p></div><div class="cloud-card invite-card"><span class="invite-label">Code à partager</span>${invite?`<strong class="invite-code">${esc(invite)}</strong>`:`<strong class="invite-code muted-code">••••••••</strong>`}<p>Ta compagne se connecte avec son propre compte puis choisit « Rejoindre mon partenaire ».</p><button class="btn ${invite?'secondary':''}" data-cloud-action="${invite?'copy-code':'renew-code'}">${invite?'Copier le code':'Générer un nouveau code'}</button><button class="text-action" data-cloud-action="check-partner">Vérifier si elle a rejoint</button><p class="cloud-status" data-cloud-status>En attente de l’autre téléphone…</p></div>`);bindCloudOnboarding();clearInterval(cloud.pairTimer);cloud.pairTimer=setInterval(()=>refreshMembership(true),5000)}
function cloudLoading(text='Synchronisation…'){cloudShell(`<div class="cloud-loading"><div class="cloud-pulse"></div><strong>${esc(text)}</strong><small>Vos attentions restent privées.</small></div>`)}

function bindCloudOnboarding(){
 document.querySelectorAll('[data-cloud-action]').forEach(b=>b.onclick=async()=>{
  const a=b.dataset.cloudAction;
  try{
   if(a==='save-config'){const url=document.querySelector('#cloud-url').value.trim().replace(/\/$/,'');const key=document.querySelector('#cloud-key').value.trim();if(!validCloudConfig({url,key})){throw new Error('Vérifie l’URL et la clé publishable.')}localStorage.setItem(CLOUD_CONFIG_STORAGE,JSON.stringify({url,key}));location.reload();return}
   if(a==='config'){setupScreen();return}
   if(a==='signin'||a==='signup'){const email=document.querySelector('#auth-email').value.trim(),password=document.querySelector('#auth-password').value;if(!email||password.length<8)throw new Error('Renseigne un e-mail et un mot de passe d’au moins 8 caractères.');setCloudBusy(true,a==='signin'?'Connexion…':'Création…');const res=a==='signin'?await cloud.client.auth.signInWithPassword({email,password}):await cloud.client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(res.error)throw res.error;if(a==='signup'&&!res.data.session){authScreen('Compte créé. Confirme ton adresse e-mail, puis connecte-toi.');return}cloud.user=res.data.user||res.data.session?.user;await continueAfterAuth();return}
   if(a==='create-couple'){const name=document.querySelector('#pair-name').value.trim();if(!name)throw new Error('Ajoute ton prénom.');setCloudBusy(true,'Création de votre espace…');const {data,error}=await cloud.client.rpc('create_couple',{p_display_name:name});if(error)throw error;const row=Array.isArray(data)?data[0]:data;localStorage.setItem('couple-v3-last-invite',row.invite_code);await refreshMembership(false,row.invite_code);return}
   if(a==='join-couple'){const name=document.querySelector('#pair-name').value.trim(),code=document.querySelector('#pair-code').value.trim().toUpperCase();if(!name||code.length<6)throw new Error('Ajoute ton prénom et le code reçu.');setCloudBusy(true,'Connexion à votre espace…');const {error}=await cloud.client.rpc('join_couple',{p_invite_code:code,p_display_name:name});if(error)throw error;await continueAfterAuth();return}
   if(a==='renew-code'){const {data,error}=await cloud.client.rpc('renew_invite_code');if(error)throw error;localStorage.setItem('couple-v3-last-invite',data);waitingPartnerScreen(data);return}
   if(a==='copy-code'){const code=localStorage.getItem('couple-v3-last-invite')||'';if(code&&navigator.clipboard)await navigator.clipboard.writeText(code);const s=document.querySelector('[data-cloud-status]');if(s)s.textContent='Code copié.';return}
   if(a==='check-partner'){await refreshMembership();return}
  }catch(e){setCloudBusy(false);const s=document.querySelector('[data-cloud-status]');if(s)s.textContent=cloudErrorMessage(e);else toast(cloudErrorMessage(e))}
 })
}

async function bootstrapConnected(){
 registerPWA();
 const cfg=cloudConfig();if(!validCloudConfig(cfg)){setupScreen();return}
 try{await loadSupabaseLibrary()}catch{}
 if(!window.supabase?.createClient){cloudShell(`<div class="cloud-error"><h1>Connexion indisponible</h1><p>La bibliothèque Supabase n’a pas pu être chargée. Vérifie la connexion Internet puis relance l’application.</p></div>`);return}
 cloud.client=window.supabase.createClient(cfg.url.replace(/\/$/,''),cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{session},error}=await cloud.client.auth.getSession();if(error){authScreen(cloudErrorMessage(error));return}
 if(!session){authScreen();return}
 cloud.user=session.user;await continueAfterAuth();
 cloud.client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session){cloud.user=null;cloud.couple=null;state=baseState();save();authScreen()}else cloud.user=session.user})
}
async function continueAfterAuth(){cloudLoading('Ouverture de votre espace…');const ok=await refreshMembership(false);if(ok&&cloud.couple?.is_complete){await syncCloud({quiet:true});subscribeCloud();render()}}
async function refreshMembership(silent=false,inviteOverride=''){
 try{const {data,error}=await cloud.client.rpc('my_couple');if(error)throw error;const row=Array.isArray(data)?data[0]:data;if(!row){cloud.couple=null;if(!silent)pairingScreen();return false}cloud.couple=row;localStorage.setItem(CLOUD_META_STORAGE,JSON.stringify(row));if(row.is_complete){clearInterval(cloud.pairTimer);localStorage.removeItem('couple-v3-last-invite');if(silent){await syncCloud({quiet:true});subscribeCloud();render()}return true}const code=inviteOverride||localStorage.getItem('couple-v3-last-invite')||'';if(!silent)waitingPartnerScreen(code);return false}catch(e){if(!silent)authScreen('Impossible d’ouvrir votre espace : '+cloudErrorMessage(e));return false}
}
function mapCloudVoucher(v,secret){return migrateRecord({id:v.id,title:secret?.title||'',message:secret?.message||'',content:secret?.content||'',usage:secret?.usage||'',offeredAt:v.offered_at,direction:v.sender_id===cloud.user.id?'sent':'received',status:v.status,mode:v.mode||secret?.initial_mode||'classic',momentAt:v.moment_at||secret?.initial_moment_at||null,exceptionWhen:v.exception_when||secret?.initial_exception_when||null,revealedAt:v.revealed_at,proposedAt:v.proposed_at,validatedAt:v.validated_at,rejectedAt:v.rejected_at,cancelledAt:v.cancelled_at,usedAt:v.used_at,color:v.color,source:secret?.source||null,catalogueId:secret?.catalogue_id||null,catalogueCategory:secret?.catalogue_category||null,customCategory:secret?.custom_category||null,lastEvent:v.last_event_type?{type:v.last_event_type,at:v.last_event_at,role:v.last_event_by===v.sender_id?'giver':'recipient'}:null})}
async function syncCloud({quiet=false}={}){if(!cloud.client||!cloud.user||!cloud.couple?.couple_id)return false;try{await cloud.client.rpc('normalize_vouchers');const {data:vouchers,error}=await cloud.client.from('vouchers').select('*').eq('couple_id',cloud.couple.couple_id).order('offered_at',{ascending:false});if(error)throw error;const ids=(vouchers||[]).map(v=>v.id);let secrets=[];if(ids.length){const res=await cloud.client.from('voucher_secrets').select('*').in('voucher_id',ids);if(res.error)throw res.error;secrets=res.data||[]}const sm=new Map(secrets.map(s=>[s.voucher_id,s]));state.records=(vouchers||[]).map(v=>mapCloudVoucher(v,sm.get(v.id)));save();if(!quiet)toast('Synchronisé');return true}catch(e){if(!quiet)toast('Synchronisation impossible');return false}}
function subscribeCloud(){if(cloud.channel)cloud.client.removeChannel(cloud.channel);if(!cloud.couple?.couple_id)return;cloud.channel=cloud.client.channel('couple-'+cloud.couple.couple_id).on('postgres_changes',{event:'*',schema:'public',table:'vouchers',filter:`couple_id=eq.${cloud.couple.couple_id}`},async()=>{const view=state.view,scroll=getScroll();await syncCloud({quiet:true});if(state.view===view){restoreScroll=scroll;render()}}).subscribe()}

async function prepareScratch(id){try{const {data,error}=await cloud.client.rpc('reveal_voucher',{p_voucher_id:id});if(error)throw error;await syncCloud({quiet:true});const r=state.records.find(x=>x.id===id);if(r&&data){r.title=data.title||r.title;r.message=data.message||r.message;r.content=data.content||r.content;r.usage=data.usage||r.usage}save();go('scratch:'+id)}catch(e){toast(cloudErrorMessage(e))}}

function settings(){const me=cloud.couple?.my_name||cloud.user?.email||'Moi',partner=cloud.couple?.partner_name||'Partenaire';const standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;return frame(`${topbar()}<p class="eyebrow">Réglages</p><h1 class="display" style="font-size:54px">Couple.</h1><div class="section"><div class="setting-card connection-card"><div class="connection-line"><span class="online-dot"></span><div><h3>Synchronisation active</h3><p>${esc(me)} & ${esc(partner)} · espace privé à deux</p></div></div><div class="action-stack"><button class="btn secondary" data-cloud-settings="sync">Actualiser maintenant</button></div></div><div class="setting-card"><h3>${standalone?'Application installée':'Installer sur ce téléphone'}</h3><p>${standalone?'Couple s’ouvre déjà comme une application.':'Ajoute Couple à l’écran d’accueil pour l’ouvrir sans l’interface du navigateur.'}</p>${standalone?'':`<div class="action-stack"><button class="btn secondary" data-cloud-settings="install">Installer l’application</button></div>`}</div><div class="setting-card"><h3>Compte</h3><p>${esc(cloud.user?.email||'')}</p><div class="action-stack"><button class="btn ghost" data-cloud-settings="signout">Se déconnecter</button></div></div></div>`)}

function bindCloudSettings(){document.querySelectorAll('[data-cloud-settings]').forEach(b=>b.onclick=async()=>{const a=b.dataset.cloudSettings;if(a==='sync'){await syncCloud();render()}if(a==='signout'){if(cloud.channel)await cloud.client.removeChannel(cloud.channel);await cloud.client.auth.signOut();localStorage.removeItem(CLOUD_META_STORAGE);state=baseState();save();authScreen()}if(a==='install'){if(cloud.installPrompt){cloud.installPrompt.prompt();await cloud.installPrompt.userChoice;cloud.installPrompt=null}else{modal('Installer Couple',/iPhone|iPad|iPod/i.test(navigator.userAgent)?'Dans le navigateur, ouvre le menu Partager puis choisis « Sur l’écran d’accueil ».':'Dans Chrome, ouvre le menu du navigateur puis choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ».',[{key:'ok',label:'Compris',fn:()=>{}}])}}})}

function normalize(){}
async function sendDraft(){syncDraft();const d=state.draft;if(!d?.title){toast('Ajoute un titre');return}if(d.exceptional&&d.exceptionWhen==='date'&&!d.momentAt){toast('Choisis le moment');return}try{const moment=d.exceptional?(d.exceptionWhen==='now'?new Date().toISOString():new Date(d.momentAt).toISOString()):null;const {error}=await cloud.client.rpc('send_voucher',{p_title:d.title,p_message:d.message||'',p_mode:d.exceptional?'exceptional':'classic',p_moment_at:moment,p_exception_when:d.exceptional?d.exceptionWhen:null,p_source:d.source||'custom',p_catalogue_id:d.catalogueId||null,p_catalogue_category:d.catalogueCategory||null,p_custom_category:d.customCategory||null,p_content:d.content||'',p_usage:d.usage||'',p_color:COLORS[state.records.length%COLORS.length]});if(error)throw error;state.draft=null;save();await syncCloud({quiet:true});modal('Bon envoyé.','Il est déjà arrivé sur l’autre téléphone, mais son contenu reste secret.',[{key:'ok',label:'Retour à l’accueil',fn:()=>rootGo('home')}])}catch(e){toast(cloudErrorMessage(e))}}
async function submitProposal(r,date,kind,modifying=false){try{const {error}=await cloud.client.rpc('propose_voucher',{p_voucher_id:r.id,p_moment_at:date,p_exception_when:kind});if(error)throw error;document.querySelector('#overlay').innerHTML='';await syncCloud({quiet:true});rerenderHere();toast(modifying?'Nouvelle date envoyée':'Proposition envoyée')}catch(e){toast(cloudErrorMessage(e))}}
async function accept(id){try{const {data,error}=await cloud.client.rpc('accept_voucher',{p_voucher_id:id});if(error)throw error;await syncCloud({quiet:true});rerenderHere();toast(data==='used'?'Bon utilisé':'Moment confirmé')}catch(e){toast(cloudErrorMessage(e))}}
async function reject(id){try{const {error}=await cloud.client.rpc('reject_voucher',{p_voucher_id:id});if(error)throw error;await syncCloud({quiet:true});rerenderHere();toast('Proposition refusée')}catch(e){toast(cloudErrorMessage(e))}}
function cancelMoment(id){const r=state.records.find(x=>x.id===id);if(!r||r.status!=='validated')return;modal('Annuler ce moment ?','Le bon restera disponible. La personne qui choisit le moment pourra en proposer un nouveau.',[{key:'yes',label:'Annuler le moment',fn:async()=>{try{const {error}=await cloud.client.rpc('cancel_voucher',{p_voucher_id:id});if(error)throw error;await syncCloud({quiet:true});rerenderHere();toast('Moment annulé')}catch(e){toast(cloudErrorMessage(e))}}},{key:'no',label:'Garder le moment',secondary:true,fn:()=>{}}])}
function finishScratch(id){setTimeout(()=>{replaceView('detail:'+id);toast('Bon découvert')},550)}

function registerPWA(){if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();cloud.installPrompt=e})}

installGuards();bootstrapConnected();
</script>
</body></html>
